<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Isolation tests</title>
  <script src="../harness.js"></script>
</head>
<body>
  <script>
    // Components never reference each other. Their scripts, demos and manifests must not mention
    // another component's tag; the practices say which go together.
    const COMPONENTS = ['sb-accordion', 'sb-annotate', 'sb-bars', 'sb-board', 'sb-c4', 'sb-callout', 'sb-chart', 'sb-choice', 'sb-code', 'sb-comments', 'sb-controls', 'sb-decision-tree', 'sb-dependencies', 'sb-discovery-card', 'sb-erd', 'sb-flowchart', 'sb-graph', 'sb-grid', 'sb-handoff', 'sb-id', 'sb-image', 'sb-inspect-mode', 'sb-json', 'sb-kanban', 'sb-lineage', 'sb-log', 'sb-math', 'sb-matrix', 'sb-modal', 'sb-notebook', 'sb-ontology', 'sb-outliner', 'sb-panel', 'sb-parameters', 'sb-person', 'sb-plane', 'sb-poll', 'sb-profile', 'sb-rule', 'sb-rules', 'sb-scenario', 'sb-scrubber', 'sb-search', 'sb-sequence', 'sb-source', 'sb-sources', 'sb-stamp', 'sb-stat', 'sb-statechart', 'sb-table', 'sb-tabs', 'sb-timeline', 'sb-tour', 'sb-trace-mode', 'sb-tree', 'sb-venn', 'sb-walkthrough', 'sb-wireframe', 'sb-xref'];

    // file:// pages can read sibling files with XHR when the runner allows file access.
    function read(path) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open('GET', path);
        request.onload = () => resolve(request.responseText);
        request.onerror = () => reject(new Error(`could not read ${path}`));
        request.send();
      });
    }

    // Matches a whole tag name, so 'sb-id' doesn't match inside 'sb-identity'.
    const mentions = (source, tag) => new RegExp(`(^|[^a-z-])${tag}(?![a-z-])`).test(source);

    // A component's stylesheet constant is called CSS, which hides the browser's CSS object inside
    // it: CSS.escape there throws, and whatever comes after it never runs. Find elements another way.
    const usesBrowserCSS = (source) => /\bCSS\.[a-z]/.test(source);

    for (const component of COMPONENTS) {
      test(`${component}/${component}.js uses nothing of the browser's CSS, which its own CSS hides`, async () => {
        const source = await read(`../../components/${component}/${component}.js`);
        assert(!usesBrowserCSS(source), 'CSS.escape, CSS.supports and the like aren\'t available inside a component: its stylesheet constant is called CSS. Find the element without them, or rename the constant in this component.');
      });
    }

    for (const component of COMPONENTS) {
      const others = COMPONENTS.filter((c) => c !== component);
      for (const file of [`${component}.js`, 'demo.html', 'manifest.md']) {
        test(`${component}/${file} mentions no other component`, async () => {
          const source = await read(`../../components/${component}/${file}`).catch(() => null);
          if (source === null) return; // not every component has a demo yet
          const found = others.filter((tag) => mentions(source, tag));
          assertEqual(found, [], 'references');
        });
      }
    }

    // Engines compute and never know a component; components never know an engine.
    const ENGINES = ['discovery'];
    for (const engine of ENGINES) {
      for (const file of [`${engine}.js`, 'manifest.md']) {
        test(`engines/${engine}/${file} mentions no component`, async () => {
          const source = await read(`../../engines/${engine}/${file}`);
          assertEqual(COMPONENTS.filter((tag) => mentions(source, tag)), [], 'references');
        });
      }
    }
    for (const component of COMPONENTS) {
      test(`${component}/${component}.js uses no engine`, async () => {
        const source = await read(`../../components/${component}/${component}.js`);
        assertEqual(ENGINES.filter((engine) => source.includes(`engines/${engine}`) || source.includes('createDiscovery')), [], 'engines');
      });
    }
  </script>
</body>
</html>
