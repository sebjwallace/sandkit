<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Name collision tests</title>
  <script>
    // Collect console errors, and claim every tag with an unrelated component before Sandkit loads.
    window.reportedErrors = [];
    const logError = console.error;
    console.error = (...args) => { reportedErrors.push(args.join(' ')); logError(...args); };

    window.TAGS = ['sb-id', 'sb-callout', 'sb-timeline', 'sb-math', 'sb-matrix', 'sb-tabs', 'sb-plane', 'sb-panel', 'sb-rules', 'sb-parameters', 'sb-log', 'sb-chart', 'sb-controls', 'sb-graph', 'sb-shell', 'sb-theme-settings'];
    for (const tag of TAGS) customElements.define(tag, class extends HTMLElement {});
  </script>
  <script src="../harness.js"></script>
  <script src="../../components/sb-id/sb-id.js"></script>
  <script src="../../components/sb-callout/sb-callout.js"></script>
  <script src="../../components/sb-timeline/sb-timeline.js"></script>
  <script src="../../components/sb-math/sb-math.js"></script>
  <script src="../../components/sb-matrix/sb-matrix.js"></script>
  <script src="../../components/sb-tabs/sb-tabs.js"></script>
  <script src="../../components/sb-plane/sb-plane.js"></script>
  <script src="../../components/sb-panel/sb-panel.js"></script>
  <script src="../../components/sb-rules/sb-rules.js"></script>
  <script src="../../components/sb-parameters/sb-parameters.js"></script>
  <script src="../../components/sb-log/sb-log.js"></script>
  <script src="../../components/sb-chart/sb-chart.js"></script>
  <script src="../../components/sb-controls/sb-controls.js"></script>
  <script src="../../components/sb-graph/sb-graph.js"></script>
  <script src="../../shell/sb-theme-settings.js"></script>
  <script src="../../shell/sb-shell.js"></script>
</head>
<body>
  <script>
    for (const tag of TAGS) {
      test(`a different component already named <${tag}> is reported, with how to rename`, () => {
        const message = reportedErrors.find((m) => m.includes(`<${tag}>`));
        assert(message, `no error reported for <${tag}>`);
        assert(message.includes(`replacing every "${tag}"`), 'explains how to rename');
      });
    }

    test('the component already registered keeps running', () => {
      assertEqual(customElements.get('sb-log').origin, undefined);
    });
  </script>
</body>
</html>
