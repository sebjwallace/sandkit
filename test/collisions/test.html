  <meta charset="utf-8">
  <title>Name collision tests</title>
  <script>
    // Collect console errors, and claim every tag with an unrelated component before Sandkit loads.
    window.reportedErrors = [];
    const logError = console.error;
    console.error = (...args) => { reportedErrors.push(args.join(' ')); logError(...args); };

    window.TAGS = ['sb-accordion', 'sb-annotate', 'sb-id', 'sb-image', 'sb-json', 'sb-bars', 'sb-board', 'sb-c4', 'sb-callout', 'sb-choice', 'sb-code', 'sb-decision-tree', 'sb-dependencies', 'sb-ontology', 'sb-erd', 'sb-flowchart', 'sb-grid', 'sb-handoff', 'sb-scrubber', 'sb-scenario', 'sb-source', 'sb-sources', 'sb-source-trace', 'sb-timeline', 'sb-tree', 'sb-venn', 'sb-walkthrough', 'sb-wireframe', 'sb-xref', 'sb-profile', 'sb-tour', 'sb-comments', 'sb-trace-mode', 'sb-inspect-mode', 'sb-outliner', 'sb-math', 'sb-matrix', 'sb-modal', 'sb-notebook', 'sb-tabs', 'sb-plane', 'sb-panel', 'sb-rule', 'sb-rules', 'sb-sequence', 'sb-stamp', 'sb-stat', 'sb-statechart', 'sb-table', 'sb-parameters', 'sb-person', 'sb-poll', 'sb-log', 'sb-chart', 'sb-controls', 'sb-graph', 'sb-shell', 'sb-theme-settings', 'sb-export'];
    for (const tag of TAGS) customElements.define(tag, class extends HTMLElement {});
  </script>
  <script src="../harness.js"></script>
  <script src="../../components/sb-id/sb-id.js"></script>
  <script src="../../components/sb-bars/sb-bars.js"></script>
  <script src="../../components/sb-board/sb-board.js"></script>

<body>
  <script>
    for (const tag of TAGS) {
      test(`a different component already named <${tag}> is reported, with how to rename`, () => {
        const message = reportedErrors.find((m) => m.includes(`<${tag}>`));
        assert(message, `no error reported for <${tag}>`);
        assert(message.includes(`replacing every "${tag}"`), 'explains how to rename');
      });
    }

    test('the component already registered keeps running', () => {
      assertEqual(customElements.get('sb-log').origin, undefined);
    });
  </script>
</body>
