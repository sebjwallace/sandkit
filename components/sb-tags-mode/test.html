<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sb-tags-mode tests</title>
  <script src="../../test/harness.js"></script>
  <script src="../../shell/sb-shell.js"></script>
  <script src="sb-tags-mode.js"></script>
</head>
<body>
  <script>
    const choiceIn = ({ tags, match }) => ({ tags, match }); // what was chosen, leaving its colours aside
    const DECLARED = [
      { tag: 'platforms', means: 'Which platform a train leaves from.' },
      { tag: 'passengers', means: 'What passengers read.' },
      { tag: 'unused', means: 'Declared, on nothing here.' },
      { tag: 'platform-moves', means: 'Trains moved.', replacedBy: ['platforms', 'passengers'] },
      { tag: 'misc', means: 'Anything else.', replacedBy: [] }
    ];

    let presses = 0; // clicks that reached the page's own buttons

    function setup({ attrs = '', declarations = DECLARED } = {}) {
      sessionStorage.clear();
      const area = mount(`<div>
        <sb-tags-mode ${attrs}></sb-tags-mode>
        <section data-ref="CARD-1" data-tags="platforms passengers">
          <button class="inner" data-ref="ROW-1" data-tags="passengers">Row</button>
          <button class="untagged" data-ref="ROW-2">Untagged row</button>
        </section>
        <p class="words" data-tags="platforms">Words with no ref</p>
        <p class="old" data-ref="OLD-1" data-tags="platform-moves misc stray" data-working="workshop-3">Old</p>
        <p class="hidden-part" hidden data-tags="platforms">Hidden</p>
        <p class="nothing">Nothing</p>
      </div>`);
      area.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => presses++));
      const el = area.querySelector('sb-tags-mode');
      el.declarations = declarations;
      return { el, area, part: (name) => area.querySelector(`.${name}`), card: area.querySelector('section[data-ref]') };
    }

    const on = (options) => { const made = setup(options); made.el.active = true; return made; };
    const q = (el, name) => el.querySelector(`.sb-tags-mode__${name}`);
    const point = (node) => node.dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
    const click = (node) => node.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    const press = (key) => document.body.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
    const chip = (el, tag, area = q(el, 'page')) => area.querySelector(`[data-tag="${tag}"]`);
    const pageTags = (el) => [...q(el, 'page').querySelectorAll('[data-tag]')].map((c) => c.dataset.tag);
    const partText = (el) => q(el, 'part').textContent;
    const shows = (el, words) => waitFor(() => partText(el).includes(words), { message: `never showed ${words}` });

    // Every sb-tag-focus until it's stopped listening.
    function listen() {
      const heard = [];
      const hear = (e) => heard.push(e.detail);
      document.addEventListener('sb-tag-focus', hear);
      heard.stop = () => document.removeEventListener('sb-tag-focus', hear);
      return heard;
    }

    // ---- The mode ----

    test('is a mode named Tags, or by its heading, with its own key', () => {
      assertEqual(setup().el.heading, 'Tags');
      assertEqual(setup().el.key, 'g');
      assertEqual(setup({ attrs: 'heading="Topics"' }).el.heading, 'Topics');
    });

    test('in the shell, listed first, it leaves T to Trace', async () => {
      sessionStorage.clear();
      const shell = mount(`<sb-shell heading="Test">
        <sb-tags-mode slot="modes"></sb-tags-mode>
        <div slot="modes" heading="Trace"></div>
      </sb-shell>`);
      await waitFor(() => shell.querySelectorAll('option').length === 3);
      assertEqual([...shell.querySelectorAll('option')].map((o) => o.textContent), ['Explore', 'Tags · G', 'Trace · T']);
    });

    test('active shows the frame, the card and a banner saying what clicking does, and fires nothing', () => {
      const { el } = setup();
      const modes = recordEvents(document, 'sb-mode');
      el.active = true;
      for (const name of ['frame', 'card', 'banner']) assert(q(el, name).matches(':popover-open'), name);
      assert(q(el, 'banner').textContent.includes('click'));
      assertEqual(modes.length, 0);
    });

    test('the card\'s close button ends the mode, as Stop does, and its bar is named for the mode', () => {
      const { el } = on({ attrs: 'heading="Topics"' });
      const heard = recordEvents(el, 'sb-mode');
      assertEqual(q(el, 'name').textContent, 'Topics');
      click(q(el, 'close'));
      assertEqual(el.active, false);
      assertEqual(heard.length, 1);
      assertEqual(heard[0].detail, { mode: 'Topics', active: false });
    });

    test('Stop and Escape end it with sb-mode, and only then', () => {
      for (const end of [(el) => click(q(el, 'button')), () => press('Escape')]) {
        const { el } = on();
        const modes = recordEvents(el, 'sb-mode');
        end(el);
        assertEqual(el.active, false);
        assertEqual(modes[0].detail, { mode: 'Tags', active: false });
        assert(!q(el, 'card').matches(':popover-open'));
      }
    });

    // ---- Pointing and holding ----

    test('pointing shows a part\'s tags with what each means', async () => {
      const { el, card } = on();
      point(card);
      await shows(el, 'CARD-1');
      assert(partText(el).includes('Which platform a train leaves from.'));
      assert(partText(el).includes('What passengers read.'));
      assert(q(el, 'outline').matches(':popover-open'));
    });

    test('the innermost tagged part counts; one with no tags shows what holds it', async () => {
      const { el, part } = on();
      point(part('inner'));
      await shows(el, 'ROW-1');
      assert(!partText(el).includes('Which platform'), 'a part takes nothing from what holds it');
      point(part('untagged'));
      await shows(el, 'CARD-1');
    });

    test('tags with no ref still show', async () => {
      const { el, part } = on();
      point(part('words'));
      await shows(el, 'Which platform');
    });

    test('pointing elsewhere keeps what\'s shown, so the pointer can reach the card', async () => {
      const { el, card, part } = on();
      point(card);
      await shows(el, 'CARD-1');
      point(part('nothing'));
      await new Promise((done) => setTimeout(done, 160));
      assert(partText(el).includes('CARD-1'));
    });

    test('a click holds and never reaches the page; again, or anywhere else, lets go', async () => {
      const { el, part } = on();
      presses = 0;
      click(part('inner'));
      assertEqual(presses, 0);
      assert(el.classList.contains('sb-tags-mode--held'));
      assert(q(el, 'banner').textContent.includes('Held'));
      point(part('words'));
      await new Promise((done) => setTimeout(done, 160));
      assert(partText(el).includes('ROW-1'), 'held stays put');
      click(part('inner'));
      assert(!el.classList.contains('sb-tags-mode--held'));
      click(part('words'));
      click(part('nothing'));
      assert(!el.classList.contains('sb-tags-mode--held'));
      assert(!partText(el).includes('This part'));
    });

    test('off, clicks act as ever', () => {
      const { part } = setup();
      presses = 0;
      click(part('inner'));
      assertEqual(presses, 1);
    });

    test('a part redrawn while held loses its outline and keeps the card', async () => {
      const { el, part } = on();
      click(part('inner'));
      part('inner').remove();
      dispatchEvent(new Event('resize'));
      assert(!q(el, 'outline').matches(':popover-open'));
      assert(partText(el).includes('ROW-1'));
    });

    // ---- Choosing ----

    test('clicking a tag chooses it, on every chip for it, and tells the page', () => {
      const { el, card } = on();
      const heard = listen();
      click(card);
      click(chip(el, 'platforms'));
      heard.stop();
      assertEqual(el.chosen, ['platforms']);
      assertEqual(heard.at(-1).tags, ['platforms']);
      assertEqual(heard.at(-1).match, 'all');
      assertEqual(chip(el, 'platforms').getAttribute('aria-pressed'), 'true');
      assertEqual(chip(el, 'platforms', q(el, 'part')).getAttribute('aria-pressed'), 'true');
    });

    test('a tag declaring a colour is sent with it, and its chip wears it', () => {
      const { el } = on();
      el.declarations = [{ tag: 'platforms', means: 'x', color: '#123456' }];
      const heard = listen();
      el.chosen = ['platforms'];
      heard.stop();
      assertEqual(heard.at(-1).colors, { platforms: '#123456' });
      el.chosen = [];
      el.chosen = ['platforms'];
      assertEqual(chip(el, 'platforms').style.getPropertyValue('--sb-tags-mode-chosen'), '#123456');
    });

    test('tags without one get a colour of their own, the same each time, in any order', () => {
      const { el } = on();
      el.declarations = [{ tag: 'platforms', means: 'x' }, { tag: 'passengers', means: 'y' }];
      const heard = listen();
      el.chosen = ['platforms', 'passengers'];
      const first = heard.at(-1).colors;
      el.chosen = ['passengers'];
      el.chosen = ['passengers', 'platforms'];
      heard.stop();
      assert(first.platforms !== first.passengers, 'different colours');
      assertEqual(heard.at(-1).colors.platforms, first.platforms);
      assertEqual(heard.at(-1).colors.passengers, first.passengers);
    });

    test('chosen tags never share a fallback colour, even when their places in the list would', () => {
      const { el } = on();
      el.declarations = Array.from({ length: 15 }, (_, i) => ({ tag: i === 0 ? 'platforms' : i === 14 ? 'passengers' : `t${i}`, means: 'x' }));
      const heard = listen();
      el.chosen = ['platforms', 'passengers'];
      const { platforms, passengers } = heard.at(-1).colors;
      assert(platforms !== passengers, `both are ${platforms}`);
      el.chosen = ['platforms'];
      heard.stop();
      assertEqual(heard.at(-1).colors.platforms, platforms, 'the first keeps its colour');
    });

    test('a tag without a colour steers clear of one a chosen tag declares', () => {
      const { el } = on();
      el.declarations = [{ tag: 'platforms', means: 'x' }, { tag: 'passengers', means: 'y', color: '#d946ef' }];
      const heard = listen();
      el.chosen = ['platforms', 'passengers'];
      heard.stop();
      assertEqual(heard.at(-1).colors.passengers, '#d946ef');
      assert(heard.at(-1).colors.platforms !== '#d946ef', 'it takes another');
    });

    test('a tag no declaration mentions still gets a colour', () => {
      const { el } = on();
      el.declarations = [];
      const heard = listen();
      el.chosen = ['platforms'];
      heard.stop();
      assert(heard.at(-1).colors.platforms, 'it has one');
    });

    test('clicking it again removes it', () => {
      const { el } = on();
      click(chip(el, 'platforms'));
      click(chip(el, 'platforms'));
      assertEqual(el.chosen, []);
      assertEqual(chip(el, 'platforms').getAttribute('aria-pressed'), 'false');
    });

    test('all is the default, and the switch shows from two tags, counting what matches', () => {
      const { el } = on();
      click(chip(el, 'platforms'));
      assert(q(el, 'switch').querySelector('button').disabled, 'nothing to switch with one tag');
      assert(q(el, 'chosen').textContent.includes('2 parts'), 'CARD-1 and the words; not the hidden one');
      click(chip(el, 'passengers'));
      assertEqual(el.match, 'all');
      assert(q(el, 'chosen').textContent.includes('1 part'), 'only CARD-1 has both');
      const heard = listen();
      click(q(el, 'switch').querySelector('[data-match="any"]'));
      heard.stop();
      assertEqual(choiceIn(heard.at(-1)), { tags: ['platforms', 'passengers'], match: 'any' });
      assert(q(el, 'chosen').textContent.includes('3 parts'));
    });

    test('Clear empties the choice and tells the page', () => {
      const { el } = on();
      click(chip(el, 'platforms'));
      const heard = listen();
      click(q(el, 'chosen').querySelector('[data-clear]'));
      heard.stop();
      assertEqual(el.chosen, []);
      assertEqual(heard.at(-1).tags, []);
    });

    test('leaving keeps them lit, and opening it again shows them, to change or clear', () => {
      const { el } = on();
      click(chip(el, 'platforms'));
      const heard = listen();
      press('Escape');
      assertEqual(heard.length, 0, 'leaving changes nothing lit');
      heard.stop();
      assertEqual(el.chosen, ['platforms']);
      assertEqual(el.querySelectorAll('.sb-tags-mode__quiet').length, 0, 'nothing else on the page shows them');
      el.active = true;
      assertEqual(chip(el, 'platforms').getAttribute('aria-pressed'), 'true');
      click(q(el, 'clear'));
      assertEqual(el.chosen, []);
    });

    // ---- The page's tags ----

    test('lists current tags, with how many visible parts carry each, most first', () => {
      const { el } = on();
      assertEqual(pageTags(el), ['passengers', 'platforms', 'stray']);
      assertEqual(chip(el, 'platforms').querySelector('.sb-tags-mode__count').textContent, '2', 'not the hidden part');
      assertEqual(chip(el, 'passengers').querySelector('.sb-tags-mode__count').textContent, '2');
    });

    test('a tag with nothing here to see isn\'t listed, unless it\'s pinned, so the pin can come off', () => {
      const { el } = on();
      assertEqual(chip(el, 'unused'), null);
      el.chosen = ['unused'];
      assertEqual(chip(el, 'unused').querySelector('.sb-tags-mode__count').textContent, '0');
      click(chip(el, 'unused'));
      assertEqual(el.chosen, []);
      assert(chip(el, 'unused'), 'it stays while the panel is open, so nothing moves');
      el.active = false;
      el.active = true;
      assertEqual(chip(el, 'unused'), null, 'and goes the next time');
    });

    const placesInPanel = (el) => [...q(el, 'page').querySelectorAll('.sb-tags-mode__entry')].map((line) => {
      const { left, top, width, height } = line.getBoundingClientRect();
      return [line.dataset.tag, left, top, width, height];
    });

    test('the list never moves: not when tags are pinned or unpinned, nor the switch used, nor Clear', () => {
      const { el } = on();
      const start = placesInPanel(el);
      const unmoved = (when) => assertEqual(placesInPanel(el), start, when);
      click(chip(el, 'platforms'));
      unmoved('pinning one');
      click(chip(el, 'passengers'));
      unmoved('pinning another');
      click(q(el, 'switch').querySelector('[data-match="any"]'));
      unmoved('switching');
      click(chip(el, 'platforms'));
      unmoved('unpinning');
      click(q(el, 'clear'));
      unmoved('clearing');
    });

    test('the list never moves when pointing shows a part\'s tags, and neither do the controls', async () => {
      const { el, card } = on();
      const start = placesInPanel(el), controls = q(el, 'chosen').getBoundingClientRect().top;
      el._show(card);
      assert(q(el, 'part').textContent.includes('platforms'), 'the part is shown');
      assertEqual(placesInPanel(el), start);
      assertEqual(q(el, 'chosen').getBoundingClientRect().top, controls);
    });

    test('the controls are always there, off until they\'re of use', () => {
      const { el } = on();
      const height = q(el, 'chosen').getBoundingClientRect().height;
      assert(q(el, 'clear').disabled, 'nothing to clear');
      click(chip(el, 'platforms'));
      assert(!q(el, 'clear').disabled, 'something to clear');
      click(chip(el, 'passengers'));
      assert(!q(el, 'switch').querySelector('button').disabled, 'two to combine');
      assertEqual(q(el, 'chosen').getBoundingClientRect().height, height, 'the same height throughout');
    });

    test('tags are listed as lines, each with a pin that fills in its colour when pinned', () => {
      const { el } = on();
      el.declarations = [{ tag: 'platforms', means: 'x', color: '#123456' }];
      el.chosen = [];
      const line = chip(el, 'platforms');
      assert(line.closest('.sb-tags-mode__list'), 'in a list');
      const pin = () => chip(el, 'platforms').querySelector('.sb-tags-mode__pin');
      assertEqual(getComputedStyle(pin()).backgroundColor, 'rgba(0, 0, 0, 0)', 'hollow to start with');
      click(line);
      assertEqual(getComputedStyle(pin()).backgroundColor, 'rgb(18, 52, 86)', 'filled once pinned');
    });

    const sign = (el, tag, which) => q(el, 'page').querySelector(`[data-sign-for="${tag}"][data-sign="${which}"]`);
    const pressed = (button) => button.getAttribute('aria-pressed') === 'true';

    test('a line comes on adding, and each has a plus and a minus, neither pressed while it is off', () => {
      const { el } = on();
      assert(!pressed(sign(el, 'platforms', 'plus')) && !pressed(sign(el, 'platforms', 'minus')), 'off');
      click(chip(el, 'platforms'));
      assert(pressed(sign(el, 'platforms', 'plus')), 'on, adding');
      assert(!pressed(sign(el, 'platforms', 'minus')));
      assertEqual(el.without, []);
    });

    test('minus takes away: the page is told, and the count follows', () => {
      const { el } = on();
      const heard = listen();
      click(chip(el, 'platforms'));
      assert(q(el, 'chosen').textContent.includes('2 parts'));
      click(sign(el, 'passengers', 'minus'));
      heard.stop();
      assertEqual(heard.at(-1).tags, ['platforms']);
      assertEqual(heard.at(-1).without, ['passengers']);
      assertEqual(el.chosen, ['platforms', 'passengers']);
      assert(q(el, 'chosen').textContent.includes('1 part'), 'only the words, not CARD-1');
    });

    test('a sign on a line that is off turns it on, and plus switches it back', () => {
      const { el } = on();
      click(sign(el, 'platforms', 'minus'));
      assertEqual(el.chosen, ['platforms']);
      assertEqual(el.without, ['platforms']);
      click(sign(el, 'platforms', 'plus'));
      assertEqual(el.chosen, ['platforms']);
      assertEqual(el.without, []);
    });

    test('turning a line off forgets its sign, so it comes back adding', () => {
      const { el } = on();
      click(sign(el, 'platforms', 'minus'));
      click(chip(el, 'platforms'));
      assertEqual(el.chosen, []);
      assertEqual(el.without, []);
      click(chip(el, 'platforms'));
      assertEqual(el.without, []);
      assert(pressed(sign(el, 'platforms', 'plus')));
    });

    test('with only minus, it takes away from everything tagged, and the switch stays off until two add', () => {
      const { el } = on();
      click(sign(el, 'passengers', 'minus'));
      assert(q(el, 'chosen').textContent.includes('2 parts'), 'the words and OLD-1');
      click(chip(el, 'platforms'));
      assert(q(el, 'switch').querySelector('button').disabled, 'only one adding, so nothing to combine');
    });

    test('signs move nothing, keep focus, and are remembered for the tab', () => {
      const { el } = on();
      const start = placesInPanel(el);
      sign(el, 'platforms', 'minus').focus();
      click(sign(el, 'platforms', 'minus'));
      assertEqual(placesInPanel(el), start);
      assertEqual(document.activeElement, sign(el, 'platforms', 'minus'));
      const saved = JSON.parse(sessionStorage.getItem('sb-tags-mode'));
      assertEqual(saved.without, ['platforms']);
    });

    const PRESETS = [
      { name: 'Where they meet', asks: 'Which parts carry both?', tags: ['platforms', 'passengers'], match: 'all' },
      { name: 'Platforms, less passengers', tags: ['platforms'], without: ['passengers'] }
    ];
    const withPresets = () => { const made = on(); made.el.presets = PRESETS; made.el.active = false; made.el.active = true; return made; };
    const preset = (el, index) => q(el, 'presets').querySelector(`[data-preset="${index}"]`);

    test('with no presets, the panel shows none and takes no room', () => {
      const { el } = on();
      assertEqual(q(el, 'presets').children.length, 0);
      assertEqual(getComputedStyle(q(el, 'presets')).display, 'none');
    });

    test('a preset shows its name as text and what it asks as a tooltip', () => {
      const { el } = on();
      el.presets = [{ name: '<b>x</b>', asks: 'why?', tags: [] }];
      el.active = false;
      el.active = true;
      assertEqual(preset(el, 0).textContent, '<b>x</b>');
      assertEqual(preset(el, 0).querySelector('b'), null);
      assertEqual(preset(el, 0).title, 'why?');
    });

    test('choosing a preset sets the lines, signs and combining, and tells the page once', () => {
      const { el } = withPresets();
      click(chip(el, 'stray'));
      const heard = listen();
      click(preset(el, 1));
      heard.stop();
      assertEqual(heard.length, 1);
      assertEqual(choiceIn(heard[0]), { tags: ['platforms'], match: 'all' });
      assertEqual(heard[0].without, ['passengers']);
      assertEqual(el.chosen, ['platforms', 'passengers']);
      assert(pressed(sign(el, 'passengers', 'minus')), 'the signs follow');
    });

    test('a preset shows as chosen only while the selection is exactly it, however it got there', () => {
      const { el } = withPresets();
      click(preset(el, 0));
      assert(pressed(preset(el, 0)), 'chosen');
      click(chip(el, 'stray'));
      assert(!pressed(preset(el, 0)), 'changed by hand');
      click(chip(el, 'stray'));
      assert(pressed(preset(el, 0)), 'back to the same selection by hand');
      click(q(el, 'switch').querySelector('[data-match="any"]'));
      assert(!pressed(preset(el, 0)), 'union is a different selection');
    });

    test('clicking a chosen preset clears it, and another replaces it', () => {
      const { el } = withPresets();
      click(preset(el, 0));
      click(preset(el, 1));
      assert(!pressed(preset(el, 0)) && pressed(preset(el, 1)));
      click(preset(el, 1));
      assertEqual(el.chosen, []);
      assertEqual(el.without, []);
    });

    test('choosing a preset moves none of the lines already listed, and keeps focus', () => {
      const { el } = withPresets();
      const start = placesInPanel(el);
      preset(el, 1).focus();
      click(preset(el, 1));
      assertEqual(placesInPanel(el), start);
      assertEqual(document.activeElement, preset(el, 1));
    });

    test('retired tags are never offered, and shown on a part with what replaced them', async () => {
      const { el, part } = on();
      assert(!pageTags(el).includes('platform-moves'));
      assert(!pageTags(el).includes('misc'));
      point(part('old'));
      await shows(el, 'OLD-1');
      assert(partText(el).includes('replaced by platforms, passengers'));
      assert(partText(el).includes('dropped'));
      assert(!q(el, 'part').querySelector('[data-tag="platform-moves"]'), 'not a choice');
    });

    test('undeclared tags are marked, and only once there are declarations', async () => {
      const { el, part } = on();
      assert(chip(el, 'stray').textContent.includes('undeclared'));
      point(part('old'));
      await shows(el, 'OLD-1');
      assert(partText(el).includes('Undeclared'));
      const bare = on({ declarations: [] }).el;
      assert(!chip(bare, 'stray').textContent.includes('undeclared'));
    });

    test('working tags are ignored', () => {
      const { el } = on();
      assert(!pageTags(el).includes('workshop-3'));
    });

    test('reads the page\'s TAGS when not handed declarations, and ignores anything unusable', () => {
      const { el } = on({ declarations: null });
      assertEqual(pageTags(el).length, 5, 'all as found on the page: no TAGS here');
      el.declarations = ['platforms', null, 7];
      el.active = false;
      el.active = true;
      assert(!chip(el, 'stray').textContent.includes('undeclared'));
    });

    test('a page with no tags says so', () => {
      sessionStorage.clear();
      const el = mount('<sb-tags-mode></sb-tags-mode>');
      el.declarations = [];
      for (const stray of document.querySelectorAll('[data-tags]')) stray.remove();
      el.active = true;
      assert(q(el, 'page').textContent.includes('Nothing here carries a tag'));
    });

    // ---- The keyboard ----

    test('arrow keys step through what\'s tagged, holding each', () => {
      const { el, card, part } = on();
      press('ArrowDown');
      assert(partText(el).includes('CARD-1'));
      press('ArrowDown');
      assert(partText(el).includes('ROW-1'));
      press('ArrowUp');
      assert(partText(el).includes('CARD-1'));
      assert(el.classList.contains('sb-tags-mode--held'));
    });

    test('with tags chosen, arrow keys step through only what\'s lit', () => {
      const { el } = on();
      click(chip(el, 'platforms'));
      press('ArrowDown');
      assert(partText(el).includes('CARD-1'));
      press('ArrowDown');
      assert(partText(el).includes('Which platform') && !partText(el).includes('CARD-1'), 'the words, skipping ROW-1');
      press('ArrowDown');
      assert(partText(el).includes('CARD-1'), 'round again');
    });

    test('arrow keys leave a field alone', () => {
      const { el, area } = on();
      area.append(Object.assign(document.createElement('input'), { className: 'field' }));
      area.querySelector('.field').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }));
      assert(!partText(el).includes('This part'));
    });

    test('a tagged part taking keyboard focus shows, and Enter on it holds', () => {
      const { el, part } = on();
      const inner = part('inner');
      const realMatches = inner.matches;
      inner.matches = (selector) => selector === ':focus-visible' || realMatches.call(inner, selector);
      inner.dispatchEvent(new FocusEvent('focusin', { bubbles: true }));
      assert(partText(el).includes('ROW-1'));
      click(inner); // what Enter on a button sends
      assert(el.classList.contains('sb-tags-mode--held'));
    });

    test('focus stays on a chip when choosing redraws the card', () => {
      const { el } = on();
      chip(el, 'platforms').focus();
      click(chip(el, 'platforms'));
      assertEqual(document.activeElement, chip(el, 'platforms'));
    });

    // ---- Memory ----

    test('remembers the choice for the tab', () => {
      const { el } = on();
      click(chip(el, 'platforms'));
      click(chip(el, 'passengers'));
      click(q(el, 'switch').querySelector('[data-match="any"]'));
      const again = document.createElement('sb-tags-mode');
      const heard = listen();
      document.body.append(again);
      heard.stop();
      assertEqual(again.chosen, ['platforms', 'passengers']);
      assertEqual(again.match, 'any');
      assertEqual(choiceIn(heard.at(-1)), { tags: ['platforms', 'passengers'], match: 'any' }, 'lit again on load');
      again.remove();
      sessionStorage.clear();
    });

    test('works when storage is missing, throws or holds nonsense', () => {
      const { getItem, setItem } = Storage.prototype;
      const boom = () => { throw new Error('no storage'); };
      try {
        Storage.prototype.getItem = boom;
        Storage.prototype.setItem = boom;
        const made = document.createElement('sb-tags-mode');
        document.body.append(made);
        made.active = true;
        made.chosen = ['platforms'];
        assertEqual(made.chosen, ['platforms']);
        made.remove();
      } finally {
        Object.assign(Storage.prototype, { getItem, setItem });
      }
      sessionStorage.setItem('sb-tags-mode', '{not json');
      const made = document.createElement('sb-tags-mode');
      document.body.append(made);
      assertEqual(made.chosen, []);
      made.remove();
      sessionStorage.clear();
    });

    // ---- The contract ----

    test('text is never rendered as markup', async () => {
      const nasty = '<img-src-x>';
      const { el, part } = on({ declarations: [{ tag: 'platforms', means: '<b>bold</b>' }, { tag: 'old', means: 'x', replacedBy: ['<i>new</i>'] }] });
      part('words').dataset.tags = `platforms ${nasty} old`;
      el.active = false;
      el.active = true;
      point(part('words'));
      await shows(el, '<b>bold</b>');
      assert(partText(el).includes(nasty));
      assert(partText(el).includes('<i>new</i>'));
      assert(!el.querySelector('b, i, img-src-x'));
    });

    test('two instances keep to their own cards', async () => {
      sessionStorage.clear();
      const area = mount('<div><sb-tags-mode class="a"></sb-tags-mode><sb-tags-mode class="b"></sb-tags-mode><p data-tags="x">x</p></div>');
      const [a, b] = area.querySelectorAll('sb-tags-mode');
      a.active = true;
      assert(q(a, 'card').matches(':popover-open'));
      assert(!q(b, 'card').matches(':popover-open'));
      assertEqual(chip(a, 'x').dataset.tag, 'x');
      click(chip(a, 'x'));
      assertEqual(a.chosen, ['x']);
      assertEqual(b.chosen, []);
      a.active = false;
      sessionStorage.clear();
    });
  </script>
</body>
