<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sb-controls tests</title>
  <script src="../../test/harness.js"></script>
  <script src="sb-controls.js"></script>
</head>
<body>
  <script>
    const click = (controls, action) => controls.querySelector(`[data-action="${action}"]`).click();
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const totalSteps = (ticks) => ticks.reduce((sum, e) => sum + e.detail.steps, 0);

    test('Play and Pause alternate, firing sb-play then sb-pause', () => {
      const controls = mount('<sb-controls></sb-controls>');
      const plays = recordEvents(controls, 'sb-play');
      const pauses = recordEvents(controls, 'sb-pause');
      click(controls, 'play');
      assert(controls.running, 'running after Play');
      click(controls, 'play');
      assert(!controls.running, 'stopped after Pause');
      assertEqual([plays.length, pauses.length], [1, 1]);
    });

    test('the play button shows what pressing it will do', () => {
      const controls = mount('<sb-controls></sb-controls>');
      assert(controls.querySelector('[data-action="play"]').textContent.includes('Play'));
      controls.running = true;
      assert(controls.querySelector('[data-action="play"]').textContent.includes('Pause'));
    });

    test('Step fires one tick of one step', () => {
      const controls = mount('<sb-controls></sb-controls>');
      const ticks = recordEvents(controls, 'sb-tick');
      click(controls, 'step');
      assertEqual(ticks.map((e) => e.detail.steps), [1]);
    });

    test('Reset fires sb-reset', () => {
      const controls = mount('<sb-controls></sb-controls>');
      const resets = recordEvents(controls, 'sb-reset');
      click(controls, 'reset');
      assertEqual(resets.length, 1);
    });

    test('events bubble, so a page can listen higher up', () => {
      const controls = mount('<sb-controls></sb-controls>');
      const ticks = recordEvents(document.body, 'sb-tick');
      click(controls, 'step');
      assertEqual(ticks.length, 1);
    });

    // ---- The clock ----

    test('while playing, ticks arrive at roughly the chosen speed', async () => {
      const controls = mount('<sb-controls></sb-controls>');
      controls.speed = 20;
      const ticks = recordEvents(controls, 'sb-tick');
      click(controls, 'play');
      await wait(500);
      const steps = totalSteps(ticks);
      assert(steps >= 5 && steps <= 15, `expected about 10 steps in half a second, got ${steps}`);
    });

    test('fast speeds take several steps per tick', async () => {
      const controls = mount('<sb-controls></sb-controls>');
      controls.speed = 600;
      const ticks = recordEvents(controls, 'sb-tick');
      controls.running = true;
      await wait(200);
      assert(ticks.some((e) => e.detail.steps > 1), 'some tick carried several steps');
    });

    test('pausing stops the ticks', async () => {
      const controls = mount('<sb-controls></sb-controls>');
      controls.speed = 60;
      controls.running = true;
      await wait(100);
      controls.running = false;
      const ticks = recordEvents(controls, 'sb-tick');
      await wait(150);
      assertEqual(ticks.length, 0);
    });

    test('setting running does not fire sb-play or sb-pause, which report the viewer\'s actions', () => {
      const controls = mount('<sb-controls></sb-controls>');
      const plays = recordEvents(controls, 'sb-play');
      const pauses = recordEvents(controls, 'sb-pause');
      controls.running = true;
      controls.running = false;
      assertEqual([plays.length, pauses.length], [0, 0]);
    });

    test('a removed controls element stops its clock', async () => {
      const controls = mount('<sb-controls></sb-controls>');
      controls.speed = 60;
      controls.running = true;
      controls.remove();
      const ticks = recordEvents(controls, 'sb-tick');
      await wait(150);
      assertEqual(ticks.length, 0);
    });

    test('offers the given speeds and reports a change as a number', () => {
      const controls = mount('<sb-controls></sb-controls>');
      controls.speeds = [{ label: 'Slow', value: 1 }, { label: 'Fast', value: 24 }];
      const changes = recordEvents(controls, 'sb-speed');
      const select = controls.querySelector('select');
      assertEqual([...select.options].map((o) => o.textContent), ['Slow', 'Fast']);
      select.value = '24';
      select.dispatchEvent(new Event('change'));
      assertEqual(changes[0].detail.value, 24);
      assertEqual(controls.speed, 24);
    });

    test('shows its label', () => {
      const controls = mount('<sb-controls></sb-controls>');
      controls.label = 'Day 3 · 08:00';
      assertEqual(controls.querySelector('.sb-controls__label').textContent, 'Day 3 · 08:00');
    });

    test('keeps properties set before it is added to the page', () => {
      const controls = document.createElement('sb-controls');
      controls.label = 'Early';
      controls.speeds = [{ label: 'Only', value: 5 }];
      controls.speed = 5;
      mount(controls);
      assertEqual(controls.querySelector('.sb-controls__label').textContent, 'Early');
      assertEqual(controls.querySelector('select').value, '5');
    });

    test('two sets of controls on one page run independently', () => {
      mount('<div><sb-controls></sb-controls><sb-controls></sb-controls></div>');
      const [a, b] = document.querySelectorAll('#test-fixture sb-controls');
      a.querySelector('[data-action="play"]').click();
      assertEqual([a.running, b.running], [true, false]);
    });
  </script>
</body>
</html>
