<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sb-board tests</title>
  <script src="../../test/harness.js"></script>
  <script src="sb-board.js"></script>
  <script src="sb-board.js"></script>
</head>
<body>
  <script>
    const note = (ref, height = 80) => `<div data-ref="${ref}" style="height: ${height}px">${ref}</div>`;
    const board = (content, layout, attributes = '') => {
      const el = mount(`<sb-board ${attributes} style="--sb-board-height: 300px; width: 600px">${content}</sb-board>`);
      if (layout) el.layout = layout;
      return el;
    };
    const overlapping = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    const assertNoOverlaps = (boxes) => {
      const list = Object.entries(boxes);
      list.forEach(([name, a], i) => list.slice(i + 1).forEach(([other, b]) => assert(!overlapping(a, b), `${name} overlaps ${other}`)));
    };
    const viewport = (el) => el.querySelector('.sb-board__viewport');
    const zoomOf = (el) => viewport(el).clientWidth / el.shown.w;

    // A seeded sequence, so a shuffled board is the same shuffle every run.
    const seeded = (seed) => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    test('items land where the layout roughly says: left of, above, beside', () => {
      const el = board(note('a') + note('b') + note('c'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }, { ref: 'c', x: 10, y: 80 }] });
      const { a, b, c } = el.placed.items;
      assert(a.x + a.w <= b.x, 'a is left of b');
      assertEqual(a.y, b.y, 'a row lines up');
      assertEqual(a.x, c.x, 'a column lines up');
      assert(a.y + a.h <= c.y, 'a is above c');
    });

    test('rough positions close together share a column or row, whatever order they come in', () => {
      const el = board(note('a') + note('b') + note('c'), { items: [{ ref: 'c', x: 13, y: 60 }, { ref: 'a', x: 8, y: 10 }, { ref: 'b', x: 70, y: 16 }] });
      const { a, b, c } = el.placed.items;
      assertEqual(a.x, c.x);
      assertEqual(a.y, b.y);
    });

    test('items at one spot stack in the order given, without overlapping', () => {
      const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 50, y: 50 }, { ref: 'b', x: 50, y: 50 }] });
      const { a, b } = el.placed.items;
      assertEqual(a.x, b.x);
      assert(a.y + a.h <= b.y, 'a comes first');
    });

    test('heights are measured, never given', () => {
      const el = board(note('a', 300) + note('b'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 10, y: 50 }] });
      assertEqual(el.placed.items.a.h, 300);
      assert(el.placed.items.b.y >= 300, 'b starts below the tall a');
    });

    test('a tall item pushes down only what is under it', () => {
      const el = board(note('tall', 400) + note('side') + note('under') + note('next'), {
        items: [{ ref: 'tall', x: 10, y: 10 }, { ref: 'side', x: 60, y: 10 }, { ref: 'under', x: 10, y: 50 }, { ref: 'next', x: 60, y: 50 }]
      });
      // 'next' shares a row with 'under', so the two stay aligned, below the tall one.
      assertEqual(el.placed.items.under.y, el.placed.items.next.y);
      const alone = board(note('tall', 400) + note('side') + note('next'), {
        items: [{ ref: 'tall', x: 10, y: 10 }, { ref: 'side', x: 60, y: 10 }, { ref: 'next', x: 60, y: 50 }]
      });
      assert(alone.placed.items.next.y < 400, 'nothing under the tall one pushes it down');
    });

    test('what is further down stays further down, even alone in its column', () => {
      const el = board(note('top') + note('low'), { items: [{ ref: 'top', x: 10, y: 10 }, { ref: 'low', x: 80, y: 80 }] });
      assert(el.placed.items.low.y > el.placed.items.top.y, 'it does not rise to the top');
    });

    test('size hints set width, and a group\'s column fills to its widest', () => {
      const el = board(note('a') + note('b') + note('c'), {
        items: [{ ref: 'a', x: 10, y: 10, size: 'small' }, { ref: 'b', x: 60, y: 10, size: 'large' }, { ref: 'c', x: 90, y: 10 }]
      });
      assertEqual(el.placed.items.a.w, 200);
      assertEqual(el.placed.items.b.w, 440);
      assertEqual(el.placed.items.c.w, 280);
      const grouped = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10, group: 'G', size: 'small' }, { ref: 'b', x: 10, y: 50, group: 'G', size: 'large' }] });
      assertEqual(grouped.placed.items.a.w, 440);
    });

    test('a group\'s frame holds its items with room for its label, and shows the label as text', () => {
      const el = board(note('a') + note('b') + note('c'), {
        items: [{ ref: 'a', x: 10, y: 10, group: '<b>Readings</b>' }, { ref: 'b', x: 10, y: 50, group: '<b>Readings</b>' }, { ref: 'c', x: 80, y: 10 }]
      });
      const { items, groups } = el.placed;
      const frame = groups['<b>Readings</b>'];
      for (const item of [items.a, items.b]) {
        assert(item.x >= frame.x && item.x + item.w <= frame.x + frame.w, 'inside across');
        assert(item.y >= frame.y + 24 && item.y + item.h <= frame.y + frame.h, 'inside down, below the label');
      }
      assert(!overlapping(frame, items.c), 'the loose item stays out');
      const label = el.querySelector('.sb-board__label');
      assertEqual(label.textContent, '<b>Readings</b>');
      assertEqual(label.querySelector('b'), null);
    });

    test('a group stays together even when its items are given places among another group\'s', () => {
      const el = board(note('a') + note('b') + note('c') + note('d'), {
        items: [
          { ref: 'a', x: 10, y: 10, group: 'One' }, { ref: 'b', x: 10, y: 60, group: 'Two' },
          { ref: 'c', x: 90, y: 10, group: 'Two' }, { ref: 'd', x: 90, y: 60, group: 'One' }
        ]
      });
      assert(!overlapping(el.placed.groups.One, el.placed.groups.Two), 'frames never overlap');
    });

    test('nothing overlaps and the same input gives the same picture, across shuffled boards', () => {
      const random = seeded(42);
      for (let round = 0; round < 12; round++) {
        const refs = Array.from({ length: 24 }, (_, i) => `n${i}`);
        const content = refs.map((ref) => note(ref, 40 + Math.floor(random() * 160))).join('');
        const items = refs.map((ref) => ({
          ref, x: Math.floor(random() * 100), y: Math.floor(random() * 100),
          group: random() < 0.5 ? `G${Math.floor(random() * 3)}` : undefined,
          size: ['small', 'medium', 'large'][Math.floor(random() * 3)]
        }));
        const one = board(content, { items }), two = board(content, { items });
        assertNoOverlaps(one.placed.items);
        assertNoOverlaps(one.placed.groups);
        assertEqual(one.placed, two.placed);
      }
    });

    test('the layout doesn\'t depend on the size of the board\'s window', () => {
      const layout = { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }] };
      const small = board(note('a') + note('b'), layout);
      small.style.width = '300px';
      small.arrange();
      const big = board(note('a') + note('b'), layout);
      big.style.width = '900px';
      big.arrange();
      assertEqual(small.placed, big.placed);
    });

    test('growing lays out again: only what is below moves, and x positions stay', async () => {
      const el = board(note('a') + note('b') + note('side'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 10, y: 60 }, { ref: 'side', x: 80, y: 10 }] });
      const before = el.placed.items;
      el.querySelector('[data-ref="a"]').style.height = '200px';
      await waitFor(() => el.placed.items.a.h === 200);
      const after = el.placed.items;
      assertEqual(after.b.y, before.b.y + 120);
      assertEqual(after.b.x, before.b.x);
      assertEqual(after.side, before.side);
    });

    test('laying out again with no change in size changes nothing', () => {
      const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10, group: 'G' }, { ref: 'b', x: 80, y: 10 }], links: [{ from: 'a', to: 'b', label: 'x' }] });
      const before = el.placed;
      el.arrange();
      assertEqual(el.placed, before);
    });

    test('the layout reads back as a copy', () => {
      const el = board(note('a'), { items: [{ ref: 'a', x: 10, y: 10 }] });
      el.layout.items[0].x = 99;
      el.layout.items.push({ ref: 'z' });
      assertEqual(el.layout.items, [{ ref: 'a', x: 10, y: 10 }]);
    });

    test('children keep their own element, and only gain a wrapper', () => {
      const el = board('<div data-ref="a" class="mine" style="height: 10px">x</div>', { items: [{ ref: 'a', x: 1, y: 1 }] });
      const child = el.querySelector('.mine');
      assertEqual(child.getAttribute('style'), 'height: 10px');
      assert(child.parentElement.classList.contains('sb-board__item'));
    });

    test('children added or removed later are laid out', async () => {
      const el = board(note('a'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }] });
      assertEqual(el.placed.items.b, undefined);
      el.insertAdjacentHTML('beforeend', note('b'));
      await waitFor(() => el.placed.items.b);
      assert(el.placed.items.b.x > el.placed.items.a.x);
      el.querySelector('[data-ref="b"]').remove();
      await waitFor(() => !el.placed.items.b);
      assertEqual(el.querySelectorAll('.sb-board__item').length, 1);
    });

    test('a group takes a place and stacks its items in order, and can be written as refs or with a size', () => {
      const el = board(note('a') + note('b') + note('c') + note('z'), {
        groups: [{ label: 'G', x: 10, y: 50, items: ['a', { ref: 'b', size: 'large' }, 'c'] }],
        items: [{ ref: 'z', x: 90, y: 50 }]
      });
      const { items: { a, b, c, z }, groups: { G } } = el.placed;
      assert(a.y + a.h <= b.y && b.y + b.h <= c.y, 'in order, top to bottom');
      assertEqual(a.x, b.x);
      assertEqual(a.w, 440, 'its column takes the widest');
      assert(a.y >= G.y && c.y + c.h <= G.y + G.h, 'in its frame');
      assert(G.x + G.w <= z.x, 'where it was placed');
      assertEqual(el.problems, []);
    });

    test('a group gives the same picture as its items written out', () => {
      const content = note('a') + note('b');
      const short = board(content, { groups: [{ label: 'G', x: 10, y: 50, items: ['a', 'b'] }] }).placed;
      const long = board(content, { items: [{ ref: 'a', x: 10, y: 10, group: 'G' }, { ref: 'b', x: 10, y: 90, group: 'G' }] }).placed;
      assertEqual(short, long);
    });

    test('an item in a group can still say where it goes, to sit beside another', () => {
      const el = board(note('a') + note('b'), { groups: [{ label: 'G', items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 60, y: 10 }] }] });
      assertEqual(el.placed.items.a.y, el.placed.items.b.y);
      assert(el.placed.items.a.x < el.placed.items.b.x);
    });

    test('problems cover what a group names, and a group with no place', () => {
      const el = board(note('a') + note('b'), { groups: [{ label: 'G', x: 1, y: 1, items: ['a', 'gone'] }, { label: 'H', items: ['b'] }] });
      assert(el.problems.some((p) => p.includes('gone is in the layout but not on the board')), el.problems.join());
      assert(el.problems.some((p) => p.includes('b has no x and y')), el.problems.join());
    });

    test('a component\'s ref can be on the top element it draws', () => {
      const el = board('<sb-demo-card><div data-ref="CARD" style="height: 40px"><span data-ref="PART">p</span></div></sb-demo-card>', { items: [{ ref: 'CARD', x: 1, y: 1 }] });
      assertEqual(Object.keys(el.placed.items), ['CARD']);
      assertEqual(el.problems, []);
    });

    test('a ref deeper down doesn\'t name a child that has none of its own', () => {
      const el = board('<div><div><span data-ref="DEEP">p</span></div></div>', { items: [] });
      assert(el.problems.some((p) => p.includes('no data-ref')), el.problems.join());
    });

    test('a child whose ref arrives after it does is placed once it settles', async () => {
      const el = board('<sb-demo-card></sb-demo-card>', { items: [{ ref: 'LATE', x: 1, y: 1 }] });
      assertEqual(el.placed.items.LATE, undefined);
      el.querySelector('sb-demo-card').innerHTML = '<div data-ref="LATE" style="height: 40px">x</div>';
      await waitFor(() => el.placed.items.LATE);
      assertEqual(el.placed.groups['Not placed yet'], undefined);
    });

    test('problems reach the console by themselves, once, and only after a layout is set', async () => {
      const warned = [], real = console.warn;
      console.warn = (message) => warned.push(message);
      try {
        const el = board(note('a'));
        await new Promise((resolve) => setTimeout(resolve, 20));
        assertEqual(warned, [], 'no layout yet, so nothing to say');
        el.layout = { items: [{ ref: 'gone', x: 1, y: 1 }, { ref: 'a', x: 50, y: 1 }] };
        el.arrange();
        await waitFor(() => warned.length);
        assert(warned[0].includes('gone is in the layout'), warned[0]);
        el.arrange();
        await new Promise((resolve) => setTimeout(resolve, 20));
        assertEqual(warned.length, 1, 'said once');
      } finally { console.warn = real; }
    });

    test('anything the layout leaves out goes under "Not placed yet", and is reported', () => {
      const el = board(note('a') + note('lost') + '<div>no ref</div>', { items: [{ ref: 'a', x: 10, y: 10 }] });
      const frame = el.placed.groups['Not placed yet'], lost = el.placed.items.lost;
      assert(lost.y >= frame.y && lost.x >= frame.x, 'inside the frame');
      assert(lost.y > el.placed.items.a.y, 'below the rest');
      assert(el.problems.some((p) => p.includes('lost is on the board but not in the layout')), 'names it');
      assert(el.problems.some((p) => p.includes('no data-ref')), 'and what has no ref');
    });

    test('what is not placed disturbs nothing: the rest lay out exactly as without it', () => {
      const items = [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 90, y: 10 }];
      const without = board(note('a') + note('b'), { items }).placed.items;
      const placed = board(note('a') + note('b') + note('lost'), { items }).placed.items;
      assertEqual([placed.a, placed.b], [without.a, without.b]);
      assert(placed.lost.y > without.a.y + without.a.h, 'below it all');
    });

    test('a layout of the wrong shape shows everything as not placed, rather than failing', () => {
      const el = board(note('a'), { items: { a: { x: 1, y: 1 } }, links: 'none' });
      assert(el.placed.items.a, 'still shown');
      assert(el.problems.some((p) => p.includes('a is on the board but not in the layout')), el.problems.join());
    });

    test('problems say what is wrong with a layout in words, and are empty when all is well', () => {
      const good = board(note('a') + note('b'), { items: [{ ref: 'a', x: 1, y: 1 }, { ref: 'b', x: 50, y: 1 }], links: [{ from: 'a', to: 'b' }] });
      assertEqual(good.problems, []);
      const bad = board(note('a') + note('b') + note('c'), {
        items: [{ ref: 'a', x: 1, y: 1, size: 'huge' }, { ref: 'a', x: 2, y: 2 }, { ref: 'gone', x: 3, y: 3 }, { ref: 'b' }, { ref: 'c', x: 1, y: 50 }],
        links: [{ from: 'a', to: 'nowhere' }]
      });
      const said = bad.problems.join(' ');
      assert(said.includes('size "huge"'), said);
      assert(said.includes('a is in the layout twice'), said);
      assert(said.includes('gone is in the layout but not on the board'), said);
      assert(said.includes('b has no x and y'), said);
      assert(said.includes("nowhere isn't on the board"), said);
    });

    test('problems say when something is wider than its place', () => {
      const el = board('<div data-ref="a" style="overflow: auto"><div style="width: 900px; height: 20px">wide</div></div>', { items: [{ ref: 'a', x: 1, y: 1 }] });
      assert(el.problems.some((p) => p.includes('a is wider than its place')), el.problems.join());
    });

    // ---- Links ----

    const crossesBox = (a, b, box) => {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
      return overlapping({ x, y, w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) }, box);
    };
    const assertClearOfItems = (el) => {
      for (const { from, to, points } of el.placed.links) {
        for (let i = 1; i < points.length; i++) {
          for (const [ref, box] of Object.entries(el.placed.items)) {
            assert(!crossesBox(points[i - 1], points[i], box), `${from}→${to} crosses ${ref}`);
          }
        }
      }
    };
    const isSquare = (points) => points.slice(1).every((p, i) => p.x === points[i].x || p.y === points[i].y);

    test('a link is a few words between two items, drawn square, with an arrowhead and its label as text', () => {
      const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }], links: [{ from: 'a', to: 'b', label: '<i>why?</i>', tone: 'warn' }] }, 'lines="square"');
      const [link] = el.placed.links;
      assertEqual([link.from, link.to], ['a', 'b']);
      assert(isSquare(link.points), 'square');
      assert(link.points[0].x === el.placed.items.a.x + el.placed.items.a.w, 'leaves a at its facing side');
      assert(link.points.at(-1).x === el.placed.items.b.x, 'arrives at b at its facing side');
      const group = el.querySelector('.sb-board__link');
      assertEqual(group.dataset.tone, 'warn');
      assert(group.querySelector('.sb-board__head'), 'has a head');
      assertEqual(group.querySelector('.sb-board__words').textContent, '<i>why?</i>');
    });

    test('a link goes around what is in its way', () => {
      const el = board(note('a') + note('wall', 300) + note('b'), {
        items: [{ ref: 'a', x: 10, y: 50 }, { ref: 'wall', x: 50, y: 50 }, { ref: 'b', x: 90, y: 50 }],
        links: [{ from: 'a', to: 'b' }]
      }, 'lines="square"');
      assert(el.placed.links[0].points.length > 2, 'it bends');
      assertClearOfItems(el);
    });

    test('links never cross an item, across shuffled boards, and take the same path each time', () => {
      const random = seeded(7);
      for (let round = 0; round < 6; round++) {
        const refs = Array.from({ length: 16 }, (_, i) => `n${i}`);
        const content = refs.map((ref) => note(ref, 40 + Math.floor(random() * 120))).join('');
        const items = refs.map((ref) => ({ ref, x: Math.floor(random() * 100), y: Math.floor(random() * 100), group: random() < 0.4 ? 'G' : undefined }));
        const links = Array.from({ length: 6 }, () => ({ from: refs[Math.floor(random() * 16)], to: refs[Math.floor(random() * 16)], label: 'rests on' }));
        const one = board(content, { items, links }, 'lines="square"'), two = board(content, { items, links }, 'lines="square"');
        assertClearOfItems(one);
        assert(one.placed.links.every((l) => isSquare(l.points)), 'square');
        assertEqual(one.placed.links, two.placed.links);
      }
    });

    test('a square link goes around what is in its way, and a straight one goes directly', () => {
      const content = note('a') + note('wall', 300) + note('b');
      const layout = { items: [{ ref: 'a', x: 10, y: 50 }, { ref: 'wall', x: 50, y: 50 }, { ref: 'b', x: 90, y: 50 }], links: [{ from: 'a', to: 'b' }] };
      assert(board(content, layout, 'lines="square"').placed.links[0].points.length > 2);
      assertEqual(board(content, layout, 'lines="straight"').placed.links[0].points.length, 2);
    });

    for (const [style, count, command] of [['straight', 2, ' L'], ['curved', 4, ' C']]) {
      test(`a ${style} link runs between the sides of its items that face each other`, () => {
        const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }], links: [{ from: 'a', to: 'b', label: 'why?' }] }, `lines="${style}"`);
        const { items: { a, b }, links: [{ points }] } = el.placed;
        assertEqual(points.length, count);
        assertEqual(points[0].x, a.x + a.w);
        assertEqual(points.at(-1).x, b.x);
        assert(el.querySelector('.sb-board__line').getAttribute('d').includes(command), 'drawn as it should be');
        assert(el.querySelector('.sb-board__head'), 'with a head');
        assertEqual(el.querySelector('.sb-board__words').textContent, 'why?');
      });

      test(`${style} links are the same each time, and two between one pair don't share a line`, () => {
        const layout = { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 40 }], links: [{ from: 'a', to: 'b' }, { from: 'b', to: 'a' }] };
        const one = board(note('a') + note('b'), layout, `lines="${style}"`).placed.links;
        const two = board(note('a') + note('b'), layout, `lines="${style}"`).placed.links;
        assertEqual(one, two);
        assert(JSON.stringify(one[0].points) !== JSON.stringify([...one[1].points].reverse()), 'different lines');
      });
    }

    test('lines are curved by default, can be changed by attribute or property, and the layout stays put', () => {
      const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }], links: [{ from: 'a', to: 'b' }] });
      const items = el.placed.items;
      assertEqual(el.lines, 'curved');
      el.lines = 'straight';
      assertEqual(el.getAttribute('lines'), 'straight');
      assertEqual(el.placed.links[0].points.length, 2);
      el.setAttribute('lines', 'square');
      assert(!el.querySelector('.sb-board__line').getAttribute('d').includes(' C'), 'redrawn');
      assertEqual(el.placed.items, items);
    });

    test('a viewer steps through the styles with a button that says which it is', () => {
      const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }], links: [{ from: 'a', to: 'b' }] });
      const button = el.querySelector('[data-tool="lines"]');
      const seen = [button.textContent];
      for (let i = 0; i < 3; i++) { button.click(); seen.push(button.textContent); }
      assertEqual(seen, ['Lines: curved', 'Lines: straight', 'Lines: square', 'Lines: curved']);
    });

    test('an unknown style is reported, and draws the default', () => {
      const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }], links: [{ from: 'a', to: 'b' }] }, 'lines="wavy"');
      assertEqual(el.lines, 'curved');
      assertEqual(el.placed.links[0].points.length, 4);
      assert(el.problems.some((p) => p.includes('"wavy"')), el.problems.join());
    });

    test('two links between the same items don\'t share a line', () => {
      const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 80, y: 10 }], links: [{ from: 'a', to: 'b' }, { from: 'b', to: 'a' }] });
      const [one, two] = el.placed.links;
      assert(JSON.stringify(one.points) !== JSON.stringify([...two.points].reverse()), 'different paths');
    });

    test('a link to something not on the board isn\'t drawn', () => {
      const el = board(note('a'), { items: [{ ref: 'a', x: 1, y: 1 }], links: [{ from: 'a', to: 'gone' }] });
      assertEqual(el.placed.links, []);
      assertEqual(el.querySelector('.sb-board__link'), null);
    });

    test('links follow when something grows', async () => {
      const el = board(note('a') + note('b'), { items: [{ ref: 'a', x: 10, y: 10 }, { ref: 'b', x: 10, y: 60 }], links: [{ from: 'a', to: 'b' }] });
      const before = el.placed.links[0].points.at(-1).y;
      el.querySelector('[data-ref="a"]').style.height = '200px';
      await waitFor(() => el.placed.links[0].points.at(-1).y !== before);
      assert(el.placed.links[0].points.at(-1).y > before);
    });

    // ---- Viewing ----

    const far = { items: [{ ref: 'a', x: 0, y: 0 }, { ref: 'b', x: 50, y: 0 }, { ref: 'c', x: 100, y: 0 }, { ref: 'd', x: 100, y: 100 }] };
    const fourNotes = note('a') + note('b') + note('c') + note('d');

    test('starts with the whole board in view, never larger than full size', () => {
      const el = board(fourNotes, far);
      const { x, y, w, h } = el.shown;
      for (const box of Object.values(el.placed.items)) assert(box.x >= x - 1 && box.x + box.w <= x + w + 1 && box.y >= y - 1 && box.y + box.h <= y + h + 1, 'in view');
      const small = board(note('a'), { items: [{ ref: 'a', x: 0, y: 0 }] });
      assertEqual(zoomOf(small), 1);
    });

    test('reveal goes to an item, a part inside one, or a group, and says if there is none', () => {
      const el = board(`<div data-ref="a" style="height: 80px"><span data-ref="a.part">p</span></div>` + note('z'), {
        items: [{ ref: 'a', x: 0, y: 0 }, { ref: 'z', x: 100, y: 0, group: 'Far' }]
      });
      assertEqual(el.reveal('z'), true);
      const shown = () => el.shown;
      const z = el.placed.items.z;
      assert(shown().x <= z.x && shown().x + shown().w >= z.x + z.w, 'z in view');
      assertEqual(el.reveal('a.part'), true);
      assert(shown().x <= el.placed.items.a.x, 'the item holding the part');
      assertEqual(el.reveal('Far'), true);
      assertEqual(el.reveal('nowhere'), false);
      const place = el.querySelector('[data-ref="z"]');
      assertEqual(el.reveal('anything', place), true);
      assertEqual(el.reveal('anything', document.body), false);
    });

    test('reveal and fit fire nothing, and fit brings back the whole board', () => {
      const el = board(fourNotes, far);
      const whole = el.shown;
      el.reveal('a');
      assert(el.shown.w < whole.w, 'closer');
      el.fit();
      assertEqual(el.shown, whole);
    });

    test('the buttons and keys zoom and pan', () => {
      const el = board(fourNotes, far);
      const start = zoomOf(el);
      el.querySelector('[data-tool="in"]').click();
      assert(zoomOf(el) > start, 'in');
      el.querySelector('[data-tool="out"]').click();
      assert(Math.abs(zoomOf(el) - start) < 0.02, 'back out');
      const key = (name) => viewport(el).dispatchEvent(new KeyboardEvent('keydown', { key: name, bubbles: true }));
      key('+');
      const before = el.shown.x;
      key('ArrowRight');
      assert(el.shown.x > before, 'arrow pans');
      key('0');
      assert(Math.abs(zoomOf(el) - start) < 0.02, '0 fits');
    });

    const stillGliding = (el) => { el.querySelector('.sb-board__space').style.transition = 'none'; };
    const inViewport = (el, part) => {
      const box = part.getBoundingClientRect(), view = viewport(el).getBoundingClientRect();
      return box.left >= view.left - 1 && box.right <= view.right + 1 && box.top >= view.top - 1 && box.bottom <= view.bottom + 1;
    };

    for (const [from, to, way] of [['a', 'd', 'right and down'], ['d', 'a', 'left and up']]) {
      test(`going to a part ${way} of the view brings it into view, and the camera catches up`, async () => {
        const el = board(fourNotes, far);
        stillGliding(el);
        el.reveal(from);
        const part = el.querySelector(`[data-ref="${to}"]`);
        const before = el.shown;
        assert(!inViewport(el, part), 'it starts out of view');
        part.scrollIntoView({ block: 'center', inline: 'center' });
        assert(inViewport(el, part), 'it is in view straight away');
        const scroller = el.querySelector('.sb-board__scroller');
        scroller.dispatchEvent(new Event('scroll')); // the browser's own comes at a frame, which tests can't rely on
        await waitFor(() => el.shown.x !== before.x);
        assert(inViewport(el, part), 'and stays there once the camera has moved and the scroller rests');
        assertEqual(scroller.scrollLeft, scroller.scrollTop, 'it rests in the middle of its room');
      });
    }

    test('pressing an item leaves it to the item, and dragging the background pans', () => {
      const el = board(`<div data-ref="a" style="height: 80px"><button>b</button></div>` + note('z'), { items: [{ ref: 'a', x: 0, y: 0 }, { ref: 'z', x: 100, y: 100 }] });
      el.querySelector('[data-tool="in"]').click();
      const press = (target, x) => target.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, clientX: x, clientY: 10 }));
      const before = el.shown.x;
      press(el.querySelector('[data-ref="a"]'), 100);
      window.dispatchEvent(new PointerEvent('pointermove', { clientX: 200, clientY: 10 }));
      window.dispatchEvent(new PointerEvent('pointerup'));
      assertEqual(el.shown.x, before, 'an item isn\'t a handle');
      press(viewport(el), 100);
      window.dispatchEvent(new PointerEvent('pointermove', { clientX: 200, clientY: 10 }));
      window.dispatchEvent(new PointerEvent('pointerup'));
      assert(el.shown.x < before, 'the background is');
    });

    test('its tools keep working while a mode is on', () => {
      const el = board(note('a'), { items: [{ ref: 'a', x: 0, y: 0 }] });
      assert(el.querySelector('.sb-board__tool').closest('[data-modes]'), 'tools are marked for modes to let through');
    });

    test('full screen goes and comes back, by button, property and Escape', () => {
      const el = board(note('a'), { items: [{ ref: 'a', x: 0, y: 0 }] });
      el.querySelector('[data-tool="full"]').click();
      assertEqual(el.fullscreen, true);
      assertEqual(getComputedStyle(viewport(el)).position, 'fixed');
      viewport(el).dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      assertEqual(el.hasAttribute('fullscreen'), false);
      el.fullscreen = true;
      el.fullscreen = false;
      assertEqual(getComputedStyle(viewport(el)).position, 'relative');
    });

    // ---- The veil ----

    const choose = (tags, match = 'all') => document.dispatchEvent(new CustomEvent('sb-tag-focus', { detail: { tags, match } }));
    const veilOn = (el) => el.querySelector('.sb-board__veil').classList.contains('sb-board__veil--on');
    const holesIn = (el) => el.querySelector('.sb-board__veil path').getAttribute('d').split('M').length - 2;
    const tagged = (ref, tags, inner = 'x') => `<div data-ref="${ref}" data-tags="${tags}" style="height: 80px">${inner}</div>`;
    const tagTest = (name, fn) => test(name, async () => {
      try { await fn(); } finally { choose([]); }
    });

    tagTest('choosing a tag veils the board with a hole for each item carrying it, and clearing lifts it', () => {
      const el = board(tagged('a', 'one') + tagged('b', 'two') + note('c'), { items: [{ ref: 'a', x: 1, y: 1 }, { ref: 'b', x: 50, y: 1 }, { ref: 'c', x: 90, y: 1 }] });
      assertEqual(veilOn(el), false, 'off to start with');
      choose(['one']);
      assertEqual(veilOn(el), true);
      assertEqual(holesIn(el), 1);
      choose([]);
      assertEqual(veilOn(el), false);
    });

    tagTest('all needs every chosen tag on one part, and any just one', () => {
      const el = board(tagged('a', 'one two') + tagged('b', 'two') + tagged('c', 'three'), { items: [{ ref: 'a', x: 1, y: 1 }, { ref: 'b', x: 50, y: 1 }, { ref: 'c', x: 90, y: 1 }] });
      choose(['one', 'two'], 'all');
      assertEqual(holesIn(el), 1);
      choose(['one', 'two'], 'any');
      assertEqual(holesIn(el), 2);
    });

    tagTest('a tag is matched whole, never as part of a longer one', () => {
      const el = board(tagged('a', 'platform-changes'), { items: [{ ref: 'a', x: 1, y: 1 }] });
      choose(['platform']);
      assertEqual(holesIn(el), 0);
    });

    tagTest('the hole is exactly the part, and only the part, whatever the zoom', () => {
      const inner = '<div style="height: 20px"></div><div data-tags="one" style="height: 30px; width: 100px">row</div>';
      const el = board(`<div data-ref="a" style="height: 80px">${inner}</div>` + note('z'), { items: [{ ref: 'a', x: 1, y: 1 }, { ref: 'z', x: 90, y: 90 }] });
      el.querySelector('.sb-board__space').style.transition = 'none';
      choose(['one']);
      const { x, y } = el.placed.items.a;
      const holeStart = () => el.querySelector('.sb-board__veil path').getAttribute('d').split('M')[2].split(' ').slice(0, 2).map(Number);
      const atFit = holeStart();
      assert(Math.abs(atFit[1] - (y + 20)) < 1, `starts at the row: ${atFit[1]} against ${y + 20}`);
      assert(atFit[0] >= x && atFit[0] <= x + 8, 'at its left');
      el.querySelector('.sb-board__tool[data-tool="in"]').click();
      choose(['one']);
      const zoomed = holeStart();
      assert(Math.abs(zoomed[1] - atFit[1]) < 1, 'the same place in board units, zoomed');
    });

    tagTest('a tagged part inside a tagged part gets one hole, so it isn\'t darkened twice over', () => {
      const el = board(tagged('a', 'one', '<span data-tags="one">inner</span>'), { items: [{ ref: 'a', x: 1, y: 1 }] });
      choose(['one']);
      assertEqual(holesIn(el), 1);
    });

    tagTest('a part folded away gets no hole, until it opens', async () => {
      const el = board('<div data-ref="a"><details><summary>s</summary><p data-tags="one">in</p></details></div>', { items: [{ ref: 'a', x: 1, y: 1 }] });
      choose(['one']);
      assertEqual(holesIn(el), 0);
      el.querySelector('details').open = true;
      el.arrange();
      assertEqual(holesIn(el), 1);
    });

    tagTest('holes follow what moves when something grows, and parts redrawn inside an item', async () => {
      const el = board(note('a') + tagged('b', 'one'), { items: [{ ref: 'a', x: 1, y: 1 }, { ref: 'b', x: 1, y: 50 }] });
      choose(['one']);
      const path = () => el.querySelector('.sb-board__veil path').getAttribute('d');
      const before = path();
      el.querySelector('[data-ref="a"]').style.height = '200px';
      el.arrange();
      assert(path() !== before, 'moved with it');
      const moved = path();
      el.querySelector('[data-ref="b"]').removeAttribute('data-tags');
      el.querySelector('[data-ref="b"]').innerHTML = '<div style="height: 40px"></div><div data-tags="one" style="height: 20px">redrawn</div>';
      await waitFor(() => path() !== moved); // the mutation observer's, with no call from here
      assertEqual(holesIn(el), 1);
    });

    tagTest('the veil lets the pointer through', () => {
      const el = board(tagged('a', 'one'), { items: [{ ref: 'a', x: 1, y: 1 }] });
      choose(['one']);
      assertEqual(getComputedStyle(el.querySelector('.sb-board__veil')).pointerEvents, 'none');
    });

    tagTest('a board made after the choice still knows it, and two boards each show their own', () => {
      choose(['one']);
      const area = mount(`<div><sb-board style="width: 500px">${tagged('a', 'one')}</sb-board><sb-board style="width: 500px">${tagged('b', 'two')}</sb-board></div>`);
      const [first, second] = area.children;
      first.layout = { items: [{ ref: 'a', x: 1, y: 1 }] };
      second.layout = { items: [{ ref: 'b', x: 1, y: 1 }] };
      assertEqual([veilOn(first), holesIn(first)], [true, 1]);
      assertEqual([veilOn(second), holesIn(second)], [true, 0]);
    });

    // ---- Dots ----

    const RED = 'rgb(255, 0, 0)';
    const chooseColoured = (tags, match = 'any') => document.dispatchEvent(new CustomEvent('sb-tag-focus', { detail: { tags, match, colors: { one: 'red', two: 'green' } } }));
    const dotsOf = (el) => [...el.querySelectorAll('.sb-board__dot')];
    const twoTags = () => board(tagged('a', 'one two') + tagged('b', 'two') + note('c'), { items: [{ ref: 'a', x: 1, y: 1 }, { ref: 'b', x: 50, y: 1 }, { ref: 'c', x: 90, y: 1 }] });

    tagTest('an item has a dot for each chosen tag it carries, in the order they were chosen, named and coloured', () => {
      const el = twoTags();
      chooseColoured(['one', 'two']);
      assertEqual(dotsOf(el).map((dot) => dot.dataset.tag), ['one', 'two', 'two']);
      const [dot] = dotsOf(el);
      assertEqual(dot.title, 'one');
      assertEqual(dot.getAttribute('aria-label'), 'one');
      assertEqual(getComputedStyle(dot).backgroundColor, RED);
      assertEqual(getComputedStyle(dot).borderRadius, '50%');
    });

    tagTest('the dots sit just above the item, at its top left', () => {
      const el = twoTags();
      chooseColoured(['one']);
      const { a } = el.placed.items, row = el.querySelector('.sb-board__dot-row');
      assertEqual(parseFloat(row.style.left), a.x);
      const bottom = parseFloat(row.style.top) + dotsOf(el)[0].offsetHeight;
      assert(bottom <= a.y && bottom >= a.y - 6, `ends at ${bottom}, the item starts at ${a.y}`);
    });

    tagTest('there are no outlines or tabs, and everything carrying a chosen tag stays bright', () => {
      const inner = '<div data-tags="one" style="height: 20px">a</div><div data-tags="two" style="height: 20px">b</div>';
      const el = board(`<div data-ref="a">${inner}</div>`, { items: [{ ref: 'a', x: 1, y: 1 }] });
      chooseColoured(['one', 'two']);
      assertEqual(holesIn(el), 2);
      assertEqual(el.querySelectorAll('.sb-board__dots button, .sb-board__ring, .sb-board__tab').length, 0);
    });

    tagTest('with all, an item needs every chosen tag on one part to have dots', () => {
      const el = twoTags();
      chooseColoured(['one', 'two'], 'all');
      assertEqual(dotsOf(el).map((dot) => dot.dataset.tag), ['one', 'two']);
    });

    tagTest('clearing takes the dots away, and an item with none of the tags has none', () => {
      const el = twoTags();
      chooseColoured(['one']);
      assertEqual(dotsOf(el).length, 1);
      choose([]);
      assertEqual(dotsOf(el).length, 0);
    });

    tagTest('dots follow their item when something grows', () => {
      const el = board(note('a') + tagged('b', 'one'), { items: [{ ref: 'a', x: 1, y: 1 }, { ref: 'b', x: 1, y: 50 }] });
      chooseColoured(['one']);
      const top = () => parseFloat(el.querySelector('.sb-board__dot-row').style.top);
      const before = top();
      el.querySelector('[data-ref="a"]').style.height = '200px';
      el.arrange();
      assertEqual(top(), before + 120);
    });

    tagTest('without colours it still works, in the accent', () => {
      const el = twoTags();
      choose(['one']);
      assertEqual(dotsOf(el).length, 1);
    });

    tagTest('drawing dots doesn\'t set itself off again', async () => {
      const el = twoTags();
      chooseColoured(['one']);
      let draws = 0;
      const original = el._drawVeil;
      el._drawVeil = function () { draws++; if (draws < 20) return original.call(this); };
      el.querySelector('[data-ref="c"]').textContent = 'changed';
      await waitFor(() => draws >= 1);
      await new Promise((resolve) => setTimeout(resolve, 50));
      assert(draws < 3, `drew ${draws} times`);
    });

    const chooseWithout = (tags, without, match = 'any') => document.dispatchEvent(new CustomEvent('sb-tag-focus', { detail: { tags, match, without, colors: {} } }));

    tagTest('what carries a tag taken away goes dark, and has no dots', () => {
      const el = twoTags(); // a: one two, b: two
      chooseWithout(['two'], ['one']);
      assertEqual(holesIn(el), 1);
      assertEqual(dotsOf(el).map((dot) => dot.dataset.tag), ['two']);
    });

    tagTest('with only tags taken away, the rest of what is tagged stays bright, with no dots', () => {
      const el = twoTags(); // c has no tags at all
      chooseWithout([], ['one']);
      assertEqual(veilOn(el), true);
      assertEqual(holesIn(el), 1);
      assertEqual(dotsOf(el).length, 0);
    });

    tagTest('the highlighting script is told the board shows chosen tags itself', () => {
      assert(twoTags().hasAttribute('data-sb-shows-chosen'));
    });

    test('an empty board says so, and its words can be set', () => {
      const el = board('', null, 'empty-text="Nothing gathered."');
      const empty = el.querySelector('.sb-board__empty');
      assertEqual(empty.hidden, false);
      assertEqual(empty.textContent, 'Nothing gathered.');
      el.insertAdjacentHTML('beforeend', note('a'));
      el.arrange();
    });

    test('two boards side by side keep apart', () => {
      const area = mount(`<div><sb-board style="--sb-board-height: 200px; width: 600px">${note('a')}</sb-board><sb-board style="--sb-board-height: 200px; width: 600px">${note('a')}</sb-board></div>`);
      const [one, two] = area.children;
      one.layout = { items: [{ ref: 'a', x: 0, y: 0, size: 'small' }] };
      two.layout = { items: [{ ref: 'a', x: 0, y: 0, size: 'large' }] };
      assertEqual(one.placed.items.a.w, 200);
      assertEqual(two.placed.items.a.w, 440);
      two.reveal('a');
      two.querySelector('[data-tool="in"]').click();
      assertEqual(zoomOf(one), 1);
    });
  </script>
</body>
</html>
