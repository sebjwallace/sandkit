<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sb-source-trace tests</title>
  <script>
    window.consoleErrors = [];
    const logError = console.error;
    console.error = (...args) => { consoleErrors.push(args.join(' ')); logError(...args); };
  </script>
  <script src="../../test/harness.js"></script>
  <script src="sb-source-trace.js"></script>
  <script src="sb-source-trace.js"></script>
</head>
<body>
  <script>
    const CATALOGUE = [
      { id: 'SRC-1', title: 'Interview', path: 'sources/interview.txt', format: 'transcript' },
      { id: 'SRC-2', title: 'Standard', path: 'sources/standard.md', format: 'document' },
      { id: 'SRC-3', title: 'Fault log', path: 'sources/faults.csv', format: 'data' },
      { id: 'SRC-4', title: 'Analysis', path: 'sources/analysis.md', format: 'notes', derivedFrom: ['SRC-1', 'SRC-3'] }
    ];
    const ITEMS = [
      { id: 'PAR-1', title: 'Floor', kind: 'Parameter', sources: [{ source: 'SRC-2', quote: 'begins at 48.8 Hz' }, { source: 'SRC-1', quote: 'below 48.8 Hz' }] },
      { id: 'RUL-1', title: 'Disconnect below the floor', kind: 'Rule', sources: [{ source: 'SRC-1', quote: 'takes blocks off' }], restsOn: ['PAR-1', 'ASM-1'] },
      { id: 'ASM-1', title: 'Faster on windy nights', kind: 'Assumption', sources: [{ source: 'SRC-4', quote: 'faster on windy nights' }], restsOn: ['QST-1', 'PAR-9'] },
      { id: 'QST-1', title: 'How much do batteries add?', kind: 'Question' },
      { id: 'SCR-1', title: 'Disconnection status', kind: 'Screen part', restsOn: ['RUL-1'] },
      { id: 'SCR-2', title: 'Status light', kind: 'Screen part', restsOn: ['SCR-1'] }
    ];

    const traceSources = customElements.get('sb-source-trace').traceSources;
    const traced = (ref, model = { items: ITEMS, catalogue: CATALOGUE }) => traceSources(model, ref);
    const ids = (result) => result.nodes.map((n) => n.id);
    const edge = (result, from, to) => result.edges.find((e) => e.from === from && e.to === to);
    const column = (result, id) => result.nodes.find((n) => n.id === id).column;

    const show = (subject = 'RUL-1', extra = {}) => {
      const trace = mount('<sb-source-trace></sb-source-trace>');
      Object.assign(trace, { items: ITEMS, catalogue: CATALOGUE, ...extra, subject });
      return trace;
    };
    const node = (trace, id) => trace.querySelector(`.sb-source-trace__node[data-node="${id}"]`);
    const point = (target) => target.dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
    const litFlows = (trace) => [...trace.querySelectorAll('.sb-source-trace__flow--lit')].map((f) => `${f.dataset.from}>${f.dataset.to}`).sort();

    // ---- Tracing ----

    test('back from an item: the items it rests on, the sources they cite, and what those came from', () => {
      const result = traced('RUL-1');
      assertEqual(ids(result).sort(), ['ASM-1', 'PAR-1', 'PAR-9', 'QST-1', 'RUL-1', 'SCR-1', 'SCR-2', 'SRC-1', 'SRC-2', 'SRC-3', 'SRC-4']);
      assertEqual(edge(result, 'PAR-1', 'RUL-1').kind, 'rests');
      assertEqual(edge(result, 'SRC-4', 'ASM-1').kind, 'cites');
      assertEqual(edge(result, 'SRC-1', 'SRC-4').kind, 'derived');
      assertEqual(edge(result, 'SRC-3', 'SRC-4').kind, 'derived');
    });

    test('lines run the way material flows, each carrying the citations it stands for', () => {
      const result = traced('RUL-1');
      assertEqual(edge(result, 'SRC-1', 'PAR-1').citations, [{ source: 'SRC-1', quote: 'below 48.8 Hz' }]);
      assertEqual(edge(result, 'PAR-1', 'SRC-1'), undefined);
      assertEqual(edge(result, 'RUL-1', 'SCR-1').citations, []);
    });

    test('forward from an item: everything resting on it, all the way', () => {
      const result = traced('RUL-1');
      assert(edge(result, 'RUL-1', 'SCR-1') && edge(result, 'SCR-1', 'SCR-2'), 'two steps forward');
      assertEqual(result.subject, { id: 'RUL-1', title: 'Disconnect below the floor', kind: 'Rule', isSource: false });
    });

    test('everything sits to the right of what it rests on, the subject in the middle', () => {
      const result = traced('RUL-1');
      for (const e of result.edges) assert(column(result, e.from) < column(result, e.to), `${e.from} before ${e.to}`);
      assert(column(result, 'SRC-1') < column(result, 'SRC-4'), 'a derived source right of what it came from');
      assert(column(result, 'ASM-1') < column(result, 'RUL-1') && column(result, 'RUL-1') < column(result, 'SCR-1'), 'subject between');
    });

    test('from a source: what was derived from it, the items citing either, and what rests on those', () => {
      const result = traced('SRC-3');
      assertEqual(result.subject.isSource, true);
      assertEqual(result.subject.kind, 'Source');
      assert(edge(result, 'SRC-3', 'SRC-4') && edge(result, 'SRC-4', 'ASM-1') && edge(result, 'ASM-1', 'RUL-1'), 'forward through the analysis');
      assertEqual(ids(result).includes('SRC-2'), false, 'nothing behind what it shaped');
    });

    test('ids the model and catalogue don\'t have are drawn as unknown, with what named them', () => {
      const result = traced('ASM-1', { items: [...ITEMS, { id: 'X-1', sources: [{ source: 'SRC-99', quote: 'q' }] }, { id: 'X-2', restsOn: ['X-1'] }], catalogue: CATALOGUE });
      assertEqual(result.missing, [{ id: 'PAR-9', from: 'ASM-1' }]);
      assertEqual(result.nodes.find((n) => n.id === 'PAR-9').type, 'missing');
      assertEqual(traced('X-2', { items: [...ITEMS, { id: 'X-1', sources: [{ source: 'SRC-99', quote: 'q' }] }, { id: 'X-2', restsOn: ['X-1'] }], catalogue: CATALOGUE }).missing,
        [{ id: 'SRC-99', from: 'X-1' }]);
    });

    test('items resting on nothing cited are reported, behind the subject only', () => {
      assertEqual(traced('RUL-1').unsupported, ['QST-1']);
      assertEqual(traced('PAR-1').unsupported, []);
    });

    test('a loop is marked and reported, and still laid out', () => {
      const items = [{ id: 'A', restsOn: ['B'] }, { id: 'B', restsOn: ['A'], sources: [{ source: 'SRC-1', quote: 'q' }] }];
      const result = traced('A', { items, catalogue: CATALOGUE });
      assertEqual(result.cycles.length, 1);
      assertEqual(result.edges.filter((e) => e.cycle).length, 1);
      assert(result.nodes.every((n) => Number.isFinite(n.column)), 'every node placed');
    });

    test('an id that is nowhere is one unknown node', () => {
      const result = traced('NOPE-1');
      assertEqual(result.nodes, [{ id: 'NOPE-1', type: 'missing', title: null, column: 0 }]);
      assertEqual(result.edges, []);
    });

    test('the same model always traces the same way', () => {
      assertEqual(JSON.stringify(traced('RUL-1')), JSON.stringify(traced('RUL-1')));
    });

    // ---- The graph ----

    test('with no subject, it says so', () => {
      const trace = mount('<sb-source-trace></sb-source-trace>');
      assertEqual(trace.querySelector('.sb-source-trace__empty').textContent, 'Choose something to see where it comes from.');
    });

    test('each node is drawn once with its code as data-ref, columns left to right', () => {
      const trace = show();
      assertEqual([...trace.querySelectorAll('.sb-source-trace__node')].map((n) => n.dataset.ref).sort(), ids(traced('RUL-1')).sort());
      const left = (id) => parseFloat(node(trace, id).style.left);
      assert(left('SRC-1') < left('SRC-4') && left('SRC-4') < left('ASM-1') && left('ASM-1') < left('RUL-1') && left('RUL-1') < left('SCR-1'), 'left to right');
    });

    test('sources are paper, the subject is marked, unknown ids are dashed, items resting on nothing cited say so', () => {
      const trace = show();
      assert(node(trace, 'SRC-2').classList.contains('sb-source-trace__node--source'), 'paper');
      assertEqual(node(trace, 'SRC-4').querySelector('.sb-source-trace__tag').textContent, 'derived · notes · md');
      assert(node(trace, 'RUL-1').classList.contains('sb-source-trace__node--subject'), 'subject');
      assertEqual(node(trace, 'PAR-9').querySelector('.sb-source-trace__name').textContent, 'Named by ASM-1');
      assertEqual(node(trace, 'QST-1').querySelector('.sb-source-trace__tag').textContent, 'Nothing cited');
    });

    test('the summary says what leads to the subject, what rests on it, and the problems', () => {
      const trace = show();
      assertEqual(trace.querySelector('.sb-source-trace__summary').textContent,
        '4 sources and 3 items lead to RUL-1, citing 4 passages; 2 items rest on it. 1 unknown id, 1 item resting on nothing cited.');
      trace.subject = 'QST-1';
      assertEqual(trace.querySelector('.sb-source-trace__summary').textContent, 'QST-1 rests on no cited source; 4 items rest on it.');
    });

    test('a line for every flow, and those closing a loop drawn apart', () => {
      const trace = show('A', { items: [{ id: 'A', restsOn: ['B'] }, { id: 'B', restsOn: ['A'] }] });
      assertEqual(trace.querySelectorAll('.sb-source-trace__flow').length, trace.result.edges.length);
      assertEqual(trace.querySelectorAll('.sb-source-trace__flow--cycle').length, 1);
      assertEqual(trace.querySelectorAll('.sb-source-trace__problems').length, 1);
    });

    test('a line skipping a column runs straight through an empty place in it', () => {
      const trace = show('RUL-1');
      const path = trace.querySelector('.sb-source-trace__flow[data-from="SRC-1"][data-to="RUL-1"] .sb-source-trace__line').getAttribute('d');
      assert(/ L/.test(path), `a straight run through a gap: ${path}`);
    });

    test('a catalogue\'s and model\'s text is never rendered as markup', () => {
      const trace = show('<b>X</b>', { items: [{ id: '<b>X</b>', title: '<img src=x onerror="window.ran=1">', kind: '<i>k</i>', sources: [{ source: '<u>S</u>', quote: 'q' }] }],
        catalogue: [{ id: '<u>S</u>', title: '<em>T</em>', format: '<s>f</s>' }] });
      assertEqual(trace.querySelectorAll('b, i, u, em, s, img').length, 0);
      assertEqual(node(trace, '<b>X</b>').querySelector('.sb-source-trace__name').textContent, '<img src=x onerror="window.ran=1">');
      assert(!window.ran, 'nothing ran');
    });

    // ---- Opening, tracing on and going back ----

    test('clicking a source fires sb-open and stays on the trace', () => {
      const trace = show();
      const events = recordEvents(trace, 'sb-open');
      node(trace, 'SRC-4').click();
      assertEqual(events.map((e) => e.detail), [{ id: 'SRC-4' }]);
      assertEqual(trace.subject, 'RUL-1');
    });

    test('clicking an item traces from it, fires sb-follow, and keeps the trail', () => {
      const trace = show();
      const events = recordEvents(trace, 'sb-follow');
      node(trace, 'ASM-1').click();
      assertEqual(events.map((e) => e.detail), [{ id: 'ASM-1' }]);
      assertEqual(trace.subject, 'ASM-1');
      assertEqual(trace.trail, ['RUL-1']);
      assert(node(trace, 'ASM-1').classList.contains('sb-source-trace__node--subject'), 'the new subject');
    });

    test('the subject and unknown ids aren\'t buttons, so clicking them does nothing', () => {
      const trace = show();
      assertEqual(node(trace, 'RUL-1').tagName, 'DIV');
      assertEqual(node(trace, 'PAR-9').tagName, 'DIV');
      const events = [...recordEvents(trace, 'sb-open'), ...recordEvents(trace, 'sb-follow')];
      node(trace, 'RUL-1').click();
      node(trace, 'PAR-9').click();
      assertEqual(events.length, 0);
    });

    test('Back and the crumbs return along the trail and fire sb-back', () => {
      const trace = show();
      node(trace, 'ASM-1').click();
      node(trace, 'QST-1').click();
      assertEqual(trace.trail, ['RUL-1', 'ASM-1']);
      const events = recordEvents(trace, 'sb-back');
      trace.querySelector('.sb-source-trace__back').click();
      assertEqual(trace.subject, 'ASM-1');
      trace.querySelector('.sb-source-trace__crumb').click();
      assertEqual(trace.subject, 'RUL-1');
      assertEqual(events.map((e) => e.detail.id), ['ASM-1', 'RUL-1']);
      assertEqual(trace.querySelector('.sb-source-trace__trail'), null);
    });

    test('setting the subject fires nothing; clearTrail forgets the way here', () => {
      const trace = show();
      const events = [...recordEvents(trace, 'sb-follow'), ...recordEvents(trace, 'sb-back')];
      trace.subject = 'PAR-1';
      assertEqual(trace.trail, ['RUL-1']);
      trace.clearTrail();
      assertEqual(trace.trail, []);
      assertEqual(events.length, 0);
    });

    // ---- Pointing ----

    test('the subject\'s lines are lit until something is pointed at', () => {
      const trace = show('ASM-1');
      assertEqual(litFlows(trace), ['ASM-1>RUL-1', 'PAR-9>ASM-1', 'QST-1>ASM-1', 'SRC-4>ASM-1']);
    });

    test('pointing at a node lights it and its lines, and fires sb-point', () => {
      const trace = show('ASM-1');
      const events = recordEvents(trace, 'sb-point');
      point(node(trace, 'SRC-4').querySelector('.sb-source-trace__name'));
      assert(node(trace, 'SRC-4').classList.contains('sb-source-trace__node--lit'), 'lit');
      assertEqual(litFlows(trace), ['SRC-1>SRC-4', 'SRC-3>SRC-4', 'SRC-4>ASM-1']);
      trace.dispatchEvent(new PointerEvent('pointerleave'));
      assertEqual(events.map((e) => e.detail.id), ['SRC-4', null]);
    });

    test('highlight lights nodes and their lines, and survives retracing', () => {
      const trace = show('RUL-1', { highlight: ['SRC-2'] });
      assert(node(trace, 'SRC-2').classList.contains('sb-source-trace__node--lit'));
      trace.subject = 'PAR-1';
      assert(node(trace, 'SRC-2').classList.contains('sb-source-trace__node--lit'), 'still lit');
      assertEqual(litFlows(trace), ['SRC-2>PAR-1']);
    });

    // ---- The sandbox's own nodes ----

    const ownLook = (calls = []) => (n) => {
      calls.push(n.id);
      if (n.id === 'QST-1') return null;
      return Object.assign(document.createElement('span'), { className: 'own', textContent: `${n.type} ${n.id}` });
    };

    test('drawNode gives sources and items the sandbox\'s own look, or the trace\'s where it returns null', () => {
      const trace = show('RUL-1', { drawNode: ownLook() });
      assert(node(trace, 'SRC-1').classList.contains('sb-source-trace__node--own'), 'a source drawn by the sandbox');
      assertEqual(node(trace, 'SRC-1').querySelector('.own').textContent, 'source SRC-1');
      assertEqual(node(trace, 'ASM-1').querySelector('.own').textContent, 'item ASM-1');
      assert(!node(trace, 'QST-1').classList.contains('sb-source-trace__node--own'), 'null keeps the trace\'s look');
      assert(node(trace, 'QST-1').querySelector('.sb-source-trace__id'), 'with its id');
    });

    test('the trace still places, lights and follows the sandbox\'s own nodes', () => {
      const trace = show('RUL-1', { drawNode: ownLook() });
      assert(node(trace, 'RUL-1').classList.contains('sb-source-trace__node--subject'), 'the subject marked');
      point(node(trace, 'PAR-1').querySelector('.own'));
      assert(node(trace, 'PAR-1').classList.contains('sb-source-trace__node--lit'), 'pointing lights it');
      node(trace, 'ASM-1').querySelector('.own').click();
      assertEqual(trace.subject, 'ASM-1');
      assert(node(trace, 'ASM-1').querySelector('.own'), 'drawn again after retracing');
    });

    test('unknown ids keep the trace\'s own warning look, and are never handed to drawNode', () => {
      const calls = [];
      const trace = show('ASM-1', { drawNode: ownLook(calls) });
      assert(node(trace, 'PAR-9').classList.contains('sb-source-trace__node--missing'), 'still marked missing');
      assert(!node(trace, 'PAR-9').classList.contains('sb-source-trace__node--own'), 'not the sandbox\'s look');
      assert(!calls.includes('PAR-9'), 'never asked for');
    });

    test('nodeSize sizes every node and spaces the columns to match', () => {
      const trace = show('RUL-1', { nodeSize: { width: 200, height: 90 } });
      assertEqual(node(trace, 'RUL-1').style.width, '200px');
      assertEqual(node(trace, 'RUL-1').style.height, '90px');
      const left = (id) => parseFloat(node(trace, id).style.left);
      assertEqual(left('RUL-1') - left('ASM-1'), 244, 'one column apart: a node and the gap');
      assertEqual(trace.nodeSize, { width: 200, height: 90 });
    });

    // ---- Instances and loading ----

    test('two instances side by side keep their own subject, trail and pointing', () => {
      const a = mount('<sb-source-trace></sb-source-trace><sb-source-trace></sb-source-trace>');
      const b = a.nextElementSibling;
      Object.assign(a, { items: ITEMS, catalogue: CATALOGUE, subject: 'RUL-1' });
      Object.assign(b, { items: ITEMS, catalogue: CATALOGUE, subject: 'SRC-3' });
      node(a, 'ASM-1').click();
      a.highlight = ['SRC-1'];
      assertEqual(a.trail, ['RUL-1']);
      assertEqual(b.trail, []);
      assertEqual(b.subject, 'SRC-3');
      assertEqual(b.querySelectorAll('.sb-source-trace__node--lit').length, 0);
      assert(a.querySelector('.sb-source-trace__full') && b.querySelector('.sb-source-trace__full'), 'each has full screen');
    });

    test('loading the script twice is skipped quietly', () => {
      assertEqual(consoleErrors.length, 0);
      assertEqual(customElements.get('sb-source-trace').origin, 'sandkit/sb-source-trace');
    });
  </script>
</body>
</html>
