<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sb-chart tests</title>
  <script src="../../test/harness.js"></script>
  <script src="sb-chart.js"></script>
</head>
<body>
  <script>
    const pointsOf = (polyline) => polyline.getAttribute('points').split(' ').map((p) => p.split(',').map(Number));

    test('shows a placeholder until there are at least two values', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Stock', values: [5] }] };
      assertEqual(chart.querySelector('.sb-chart__empty').textContent, 'No data yet.');
      assertEqual(chart.querySelector('svg'), null);
    });

    test('draws one line per series, with a point per value', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'A', values: [1, 2, 3] }, { label: 'B', values: [3, 2, 1] }] };
      const lines = chart.querySelectorAll('.sb-chart__series');
      assertEqual(lines.length, 2);
      assertEqual(pointsOf(lines[0]).length, 3);
    });

    test('draws higher values higher up', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Rising', values: [0, 10] }] };
      const [[, firstY], [, lastY]] = pointsOf(chart.querySelector('.sb-chart__series'));
      assert(lastY < firstY, 'a rising series should go up the chart');
    });

    test('aligns a shorter series with the latest values', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Long', values: [1, 2, 3, 4] }, { label: 'Short', values: [1, 2] }] };
      const [long, short] = [...chart.querySelectorAll('.sb-chart__series')].map(pointsOf);
      assertEqual(short.at(-1)[0], long.at(-1)[0], 'last points share an x position');
      assert(short[0][0] > long[0][0], 'the shorter series starts later');
    });

    test('draws labelled reference lines', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Stock', values: [1, 2] }], lines: [{ value: 40, label: 'Reorder 40' }] };
      assertEqual(chart.querySelectorAll('.sb-chart__line').length, 1);
      assertEqual(chart.querySelector('.sb-chart__line-label').textContent, 'Reorder 40');
    });

    test('scales to yMax when given', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Stock', values: [1, 2] }], yMax: 120 };
      const ticks = [...chart.querySelectorAll('.sb-chart__tick')].map((t) => t.textContent);
      assert(ticks.includes('120'), `expected a 120 tick, got ${ticks}`);
    });

    test('shows its heading attribute and updates when it changes', () => {
      const chart = mount('<sb-chart heading="Stock"></sb-chart>');
      assertEqual(chart.querySelector('.sb-chart__heading').textContent, 'Stock');
      chart.setAttribute('heading', 'Orders');
      assertEqual(chart.querySelector('.sb-chart__heading').textContent, 'Orders');
    });

    test('draws negative values below zero, with zero marked', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Balance', values: [50, -30] }] };
      const [[, aboveY], [, belowY]] = pointsOf(chart.querySelector('.sb-chart__series'));
      const axisY = Number(chart.querySelector('.sb-chart__axis').getAttribute('y1'));
      assert(aboveY < axisY && belowY > axisY, 'the zero axis sits between the two values');
      const ticks = [...chart.querySelectorAll('.sb-chart__tick')].map((t) => t.textContent);
      assert(ticks.includes('0') && ticks.some((t) => Number(t) <= -30), `ticks: ${ticks}`);
    });

    test('data beyond yMin or yMax widens the range, so no line is cut off', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Balance', values: [-500, -2600] }], yMin: -1700, yMax: 0 };
      const [, , , height] = chart.querySelector('svg').getAttribute('viewBox').split(' ').map(Number);
      const ys = chart.querySelector('.sb-chart__series').getAttribute('points').split(' ').map((p) => Number(p.split(',')[1]));
      assert(Math.max(...ys) <= height && Math.min(...ys) >= 0, `points within the drawing: ${ys}`);
    });

    test('keeps the axis inside the drawing when every value is below zero', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Balance', values: [-500, -900] }], yMax: -400 };
      const axisY = Number(chart.querySelector('.sb-chart__axis').getAttribute('y1'));
      assert(axisY >= 0, `axis at ${axisY}`);
    });

    test('starts from yMin when given', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Temperature', values: [18, 21] }], yMin: 15, yMax: 25 };
      const ticks = [...chart.querySelectorAll('.sb-chart__tick')].map((t) => t.textContent);
      assertEqual(ticks, ['25', '15']);
    });

    test('marks the latest value of each line', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Stock', values: [5, 9, 7] }] };
      const point = chart.querySelector('.sb-chart__point');
      const last = pointsOf(chart.querySelector('.sb-chart__series')).at(-1);
      assertEqual([Number(point.getAttribute('cx')), Number(point.getAttribute('cy'))], last);
      assertEqual(point.querySelector('title').textContent, 'Stock: 7');
    });

    test('names several lines in a legend, with their latest values', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Rabbits', values: [40, 52] }, { label: 'Foxes', values: [9, 7.5] }] };
      const keys = [...chart.querySelectorAll('.sb-chart__key')].map((k) => k.textContent.replace(/\s+/g, ' ').trim());
      assertEqual(keys, ['Rabbits 52', 'Foxes 7.5']);
    });

    test('shows no legend for a single line', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = { series: [{ label: 'Stock', values: [1, 2] }] };
      assertEqual(chart.querySelector('.sb-chart__legend'), null);
    });

    test('colours lines by their tone, or in turn when none is given', () => {
      const chart = mount('<sb-chart></sb-chart>');
      chart.data = {
        series: [{ label: 'A', values: [1, 2] }, { label: 'B', values: [2, 1], tone: 'bad' }],
        lines: [{ value: 1, label: 'Limit', tone: 'warn' }, { value: 2, label: 'Target' }]
      };
      const [a, b] = chart.querySelectorAll('.sb-chart__series');
      assert(a.classList.contains('sb-chart--accent') && b.classList.contains('sb-chart--bad'), 'series tones');
      const [limit, target] = chart.querySelectorAll('.sb-chart__line');
      assert(limit.classList.contains('sb-chart--warn') && target.classList.contains('sb-chart--muted'), 'line tones');
    });

    // Redrawing on resize relies on the browser's resize notifications, which only arrive while
    // the page is rendering (not in background tabs or under headless virtual time), so it is
    // checked by hand in a real browser. What is tested here is that each drawing uses the
    // chart's real width.
    test('draws at its real width, so text keeps its size', () => {
      const chart = mount('<sb-chart style="width: 620px"></sb-chart>');
      chart.data = { series: [{ label: 'A', values: [1, 2] }] };
      assertEqual(chart.querySelector('svg').getAttribute('width'), '620');
      chart.style.width = '300px';
      chart.data = chart.data;
      assertEqual(chart.querySelector('svg').getAttribute('width'), '300');
    });

    // ---- Reading values, labelling time, pointing and the cursor ----

    const WEEK = { series: [{ id: 'stock', label: 'Stock', values: [80, 64, 51, 70, 66] }, { label: 'Sales', values: [12, 18, 15] }] };

    function weekChart(extra = {}) {
      const chart = mount('<sb-chart style="width: 500px"></sb-chart>');
      chart.data = { ...WEEK, ...extra };
      return chart;
    }

    // Moves the pointer to a position along the chart.
    function pointAt(chart, position, type = 'pointermove') {
      const svg = chart.querySelector('svg');
      const line = chart.querySelector('.sb-chart__series');
      const [first, last] = [pointsOf(line)[0][0], pointsOf(line).at(-1)[0]];
      const x = svg.getBoundingClientRect().left + first + (position / 4) * (last - first);
      line.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: x, clientY: svg.getBoundingClientRect().top + 40 }));
    }
    const readout = (chart) => [...chart.querySelectorAll('.sb-chart__readout')].map((t) => t.textContent);

    test('pointing at the chart shows the values there, with its label along the bottom', () => {
      const chart = weekChart({ xLabels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] });
      pointAt(chart, 1);
      assertEqual(readout(chart), ['Tue', 'Stock: 64']);
      pointAt(chart, 3);
      assertEqual(readout(chart), ['Thu', 'Stock: 70', 'Sales: 18'], 'a shorter series joins where it starts');
      assert(chart.querySelector('.sb-chart__guide'), 'with a guide line');
      chart.dispatchEvent(new PointerEvent('pointerleave'));
      assertEqual(chart.querySelector('.sb-chart__guide'), null, 'gone when the pointer leaves');
    });

    test('pointing fires sb-point as the position changes, and clicking fires sb-select', () => {
      const chart = weekChart();
      const points = recordEvents(chart, 'sb-point'), selections = recordEvents(chart, 'sb-select');
      pointAt(chart, 2);
      pointAt(chart, 2);
      pointAt(chart, 4);
      chart.dispatchEvent(new PointerEvent('pointerleave'));
      assertEqual(points.map((e) => e.detail.position), [2, 4, null]);
      pointAt(chart, 1, 'click');
      assertEqual(selections[0].detail, { position: 1 });
    });

    test('labels along the bottom line up with the latest positions, the latest always shown', () => {
      const chart = weekChart({ xLabels: ['Wed', 'Thu', 'Fri'] });
      const labels = [...chart.querySelectorAll('.sb-chart__x-label')];
      assertEqual(labels.at(-1).textContent, 'Fri');
      const fri = Number(labels.at(-1).getAttribute('x'));
      assertEqual(fri, pointsOf(chart.querySelector('.sb-chart__series')).at(-1)[0], 'under the latest values');
    });

    test('labels along the bottom thin out to fit', () => {
      const chart = mount('<sb-chart style="width: 300px"></sb-chart>');
      chart.data = { series: [{ label: 'A', values: Array.from({ length: 30 }, (_, i) => i) }], xLabels: Array.from({ length: 30 }, (_, i) => `D${i + 1}`) };
      const shown = [...chart.querySelectorAll('.sb-chart__x-label')].map((t) => t.textContent);
      assert(shown.length > 1 && shown.length <= 5, `a few: ${shown}`);
      assertEqual(shown.at(-1), 'D30');
    });

    test('marks events with a labelled line at their position', () => {
      const chart = weekChart({ marks: [{ at: 2, label: 'Price rise', tone: 'warn' }, { at: 9, label: 'Out of range' }] });
      const marks = chart.querySelectorAll('.sb-chart__mark');
      assertEqual(marks.length, 1, 'only marks within the chart');
      assertEqual(Number(marks[0].getAttribute('x1')), pointsOf(chart.querySelector('.sb-chart__series'))[2][0]);
      assertEqual(chart.querySelector('.sb-chart__mark-label').textContent, 'Price rise');
      assert(marks[0].classList.contains('sb-chart--warn'), 'toned');
    });

    test('highlight brings series forward and fades the rest, by id or label', () => {
      const chart = weekChart();
      chart.highlight = ['Sales'];
      const [stock, sales] = chart.querySelectorAll('.sb-chart__series');
      assert(sales.classList.contains('sb-chart__series--highlighted') && stock.classList.contains('sb-chart__series--faded'));
      assert(chart.querySelector('.sb-chart__key[data-series="stock"]').classList.contains('sb-chart__key--faded'), 'its legend too');
      chart.highlight = [];
      assertEqual(chart.querySelectorAll('[class*="--faded"], [class*="--highlighted"]').length, 0, 'cleared');
    });

    test('highlight also makes reference lines and marks stand out, by label, without fading the series', () => {
      const chart = weekChart({ lines: [{ value: 40, label: 'Reorder' }], marks: [{ at: 2, label: 'Price rise' }, { at: 3, id: 'sale', label: 'Sale' }] });
      chart.highlight = ['Reorder', 'sale'];
      assert(chart.querySelector('.sb-chart__line').classList.contains('sb-chart__line--highlighted'), 'the line');
      assert(chart.querySelector('.sb-chart__line-label').classList.contains('sb-chart__line-label--highlighted'), 'its label');
      const marks = chart.querySelectorAll('.sb-chart__mark');
      assert(!marks[0].classList.contains('sb-chart__mark--highlighted') && marks[1].classList.contains('sb-chart__mark--highlighted'), 'the mark, by its id');
      assertEqual(chart.querySelectorAll('.sb-chart__series--faded').length, 0, 'series untouched');
    });

    test('pointing at a legend entry or a line brings it forward', () => {
      const chart = weekChart();
      chart.querySelector('.sb-chart__key[data-series="stock"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
      assert(chart.querySelector('.sb-chart__series[data-series="stock"]').classList.contains('sb-chart__series--highlighted'));
      chart.querySelector('.sb-chart__series[data-series="Sales"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
      assert(chart.querySelector('.sb-chart__series[data-series="stock"]').classList.contains('sb-chart__series--faded'), 'the other line');
      chart.dispatchEvent(new PointerEvent('pointerleave'));
      assertEqual(chart.querySelectorAll('.sb-chart__series--faded').length, 0, 'cleared');
    });

    test('current marks a position with a cursor, and the legend gives the values there', () => {
      const chart = weekChart();
      chart.current = 1;
      assertEqual(Number(chart.querySelector('.sb-chart__cursor').getAttribute('x1')), pointsOf(chart.querySelector('.sb-chart__series'))[1][0]);
      assertEqual([...chart.querySelectorAll('.sb-chart__latest')].map((v) => v.textContent), ['64', '—'], 'sales had not started');
      chart.current = null;
      assertEqual(chart.querySelector('.sb-chart__cursor'), null);
      assertEqual([...chart.querySelectorAll('.sb-chart__latest')].map((v) => v.textContent), ['66', '15'], 'back to the latest');
    });

    test('two charts on one page draw their own data', () => {
      mount('<div><sb-chart></sb-chart><sb-chart></sb-chart></div>');
      const [a, b] = document.querySelectorAll('#test-fixture sb-chart');
      a.data = { series: [{ label: 'A', values: [1, 2, 3] }] };
      assertEqual([a.querySelectorAll('polyline').length, b.querySelectorAll('polyline').length], [1, 0]);
    });
  </script>
</body>
</html>
