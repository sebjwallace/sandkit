<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shell and theming tests</title>
  <script src="../test/harness.js"></script>
  <script src="sb-theme-settings.js"></script>
  <script src="sb-shell.js"></script>
  <script src="sb-export.js"></script>
</head>
<body>
  <script>
    const root = document.documentElement;
    const token = (name) => getComputedStyle(root).getPropertyValue(`--sb-${name}`).trim();

    // A shell with the theme section, as sandboxes declare it.
    function shell(inner = '', attrs = '') {
      return mount(`<sb-shell heading="Test sandbox" ${attrs}><sb-theme-settings slot="settings"></sb-theme-settings>${inner}</sb-shell>`);
    }

    // Returns theme settings with the token editor open, after resetting to the default theme.
    function openThemeEditor(el = shell()) {
      const themes = el.querySelector('sb-theme-settings');
      themes.querySelector('[value="auto"]').click();
      themes.querySelector('[data-action="customise"]').click();
      return themes;
    }

    function editToken(themes, name, value) {
      const input = themes.querySelector(`[data-token="${name}"]`);
      input.value = value;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    // ---- Header ----

    test('a shell moved while the page loads is built once', () => {
      Object.defineProperty(document, 'readyState', { value: 'loading', configurable: true });
      let el;
      try {
        el = mount('<sb-shell heading="Moved"><p>Goal</p></sb-shell>');
        document.body.append(el); // moved by another element, before the page has loaded
      } finally {
        delete document.readyState;
      }
      document.dispatchEvent(new Event('DOMContentLoaded'));
      assertEqual(el.querySelectorAll('.sb-shell__bar').length, 1);
      el.remove();
    });

    test('shows the heading and wraps other children as header content', () => {
      const el = shell('<p>The goal</p>');
      assertEqual(el.querySelector('.sb-shell__heading').textContent, 'Test sandbox');
      assertEqual(el.querySelector('.sb-shell__content').textContent, 'The goal');
    });

    test('places slot="actions" children beside the controls', () => {
      const el = shell('<button slot="actions">Share</button><p>Goal</p>');
      assertEqual(el.querySelector('.sb-shell__actions').textContent, 'Share');
      assert(!el.querySelector('.sb-shell__content').textContent.includes('Share'));
    });

    // ---- Modes ----

    // Two plain elements as modes: a heading and an active property are all a mode needs.
    function withModes() {
      const el = shell('<span slot="modes" heading="Comment"></span><span slot="modes" heading="Trace"></span>');
      const modes = [...el.querySelectorAll('.sb-shell__modes span')];
      modes.forEach((mode) => { mode.active = false; });
      const picker = el.querySelector('.sb-shell__mode');
      const choose = (text) => {
        picker.value = [...picker.options].find((o) => o.text === text).value;
        picker.dispatchEvent(new Event('change'));
      };
      return { el, modes, picker, choose };
    }

    test('without modes there is no mode picker', () => {
      assert(shell().querySelector('.sb-shell__modes').hidden);
    });

    test('the mode picker offers Explore, then each mode by its heading, marked for every mode to let through', () => {
      const { picker } = withModes();
      assertEqual([...picker.options].map((o) => o.text), ['Explore', 'Comment', 'Trace']);
      assertEqual(picker.selectedOptions[0].text, 'Explore');
      assert(picker.closest('[data-modes]'));
    });

    test('choosing a mode turns it on and the others off, and says so', () => {
      const { el, modes, choose } = withModes();
      const heard = recordEvents(el, 'sb-mode');
      choose('Comment');
      choose('Trace');
      assertEqual(modes.map((m) => m.active), [false, true]);
      choose('Explore');
      assertEqual(modes.map((m) => m.active), [false, false]);
      assertEqual(heard.map((e) => e.detail), [{ mode: 'Comment', active: true }, { mode: 'Trace', active: true }, { mode: 'Trace', active: false }]);
    });

    test('a mode that ends itself puts the picker back to Explore', () => {
      const { modes, picker, choose } = withModes();
      choose('Trace');
      modes[1].active = false;
      modes[1].dispatchEvent(new CustomEvent('sb-mode', { bubbles: true, detail: { mode: 'Trace', active: false } }));
      assertEqual(picker.selectedOptions[0].text, 'Explore');
    });

    test('a mode that starts itself turns the others off, and the picker follows', () => {
      const { modes, picker, choose } = withModes();
      choose('Trace');
      modes[0].active = true;
      modes[0].dispatchEvent(new CustomEvent('sb-mode', { bubbles: true, detail: { mode: 'Comment', active: true } }));
      assertEqual([modes[1].active, picker.selectedOptions[0].text], [false, 'Comment']);
    });

    test('a mode that refuses to start leaves the picker on Explore', () => {
      const { el, modes, picker } = withModes();
      const heard = recordEvents(el, 'sb-mode');
      Object.defineProperty(modes[0], 'active', { get: () => false, set: () => {} });
      picker.value = '0';
      picker.dispatchEvent(new Event('change'));
      assertEqual([picker.selectedOptions[0].text, heard.length], ['Explore', 0]);
    });

    test('shows the controls named in the controls attribute, in that order', () => {
      const el = shell('', 'controls="collapse settings"');
      const actions = [...el.querySelectorAll('.sb-shell__controls [data-action]')].map((b) => b.dataset.action);
      assertEqual(actions, ['collapse', 'open-settings']);
    });

    test('collapsing hides the header, fires sb-collapse and is remembered', () => {
      const el = shell();
      const events = recordEvents(el, 'sb-collapse');
      el.querySelector('[data-action="collapse"]').click();
      assert(el.collapsed && el.hasAttribute('collapsed'), 'collapsed');
      assertEqual(events[0].detail.collapsed, true);
      assertEqual(localStorage.getItem('sb-shell-collapsed'), 'true');
      el.querySelector('[data-action="expand"]').click();
      assert(!el.collapsed, 'expanded again');
    });

    // ---- Compact while scrolled ----

    // A shell above a tall page, scrolled so the shell is fully out of view (or not), as a viewer would.
    function scrolledShell(attrs = '') {
      const el = shell('', attrs);
      el.after(Object.assign(document.createElement('div'), { style: 'height: 3000px' }));
      return el;
    }
    function scrollPage(y) {
      window.scrollTo(0, y);
      window.dispatchEvent(new Event('scroll'));
    }

    test('scrolled past, the header goes compact, keeping its place so nothing moves', () => {
      const el = scrolledShell();
      const height = el.offsetHeight;
      scrollPage(height + 200);
      assert(el.compact && el.hasAttribute('compact'), 'compact');
      assertEqual(el.offsetHeight, height, 'its place on the page');
      assert(getComputedStyle(el.querySelector('.sb-shell__bar')).position === 'fixed', 'at the top of the window');
      assert(parseFloat(root.style.getPropertyValue('--sb-header-height')) > 0, 'its height published');
      scrollPage(0);
      assert(!el.compact, 'full again at the top');
      assertEqual(root.style.getPropertyValue('--sb-header-height'), '0px');
    });

    test('jumps land below the compact header, wherever the page is', () => {
      scrolledShell();
      scrollPage(0);
      assert(parseFloat(root.style.scrollPaddingTop) > 0, root.style.scrollPaddingTop);
    });

    test('a hidden header stays hidden when scrolled, and becomes compact when shown', () => {
      const el = scrolledShell();
      el.collapsed = true;
      scrollPage(2000);
      assert(!el.compact, 'stays hidden');
      el.collapsed = false;
      assert(el.compact, 'compact once shown, the page being scrolled');
      scrollPage(0);
    });

    test('focus moves to the restore button on collapse, and back on expand', () => {
      const el = shell();
      el.querySelector('[data-action="collapse"]').click();
      assertEqual(document.activeElement, el.querySelector('[data-action="expand"]'));
      el.querySelector('[data-action="expand"]').click();
      assertEqual(document.activeElement, el.querySelector('[data-action="collapse"]'));
    });

    test('offers More only when header content overflows one line', async () => {
      const el = shell(`<p>${'A long goal. '.repeat(80)}</p>`);
      await nextFrame();
      const more = el.querySelector('.sb-shell__more');
      assert(!more.hidden, 'More is shown');
      more.click();
      assertEqual(more.textContent, 'Less');

      const short = shell('<p>Short</p>');
      await nextFrame();
      assert(short.querySelector('.sb-shell__more').hidden, 'More is hidden for short content');
    });

    test('the heading can be set as a property', () => {
      const el = shell();
      el.heading = 'Renamed';
      assertEqual(el.querySelector('.sb-shell__heading').textContent, 'Renamed');
    });

    // ---- Goal and pages ----

    // This page is test.html, so that's the current page unless `page` says otherwise.
    const PAGES = [{ href: 'index.html', title: 'Start' }, { href: 'test.html', title: 'Tests' }, { href: 'stock.html?x=1#top', title: 'Stock' }];
    const pageParts = (el) => [...el.querySelectorAll('.sb-shell__page')];

    test('shows the goal as header content', () => {
      const el = shell();
      el.goal = 'Understand stock.';
      assertEqual(el.querySelector('.sb-shell__content').textContent, 'Goal: Understand stock.');
    });

    test('the page\'s own header content wins over the goal', () => {
      const el = shell('<p>Just this page</p>');
      el.goal = 'Understand stock.';
      assertEqual(el.querySelector('.sb-shell__content').textContent, 'Just this page');
    });

    test('shows the pages as links, with the current one marked and not a link', () => {
      const el = shell();
      el.pages = PAGES;
      assertEqual(pageParts(el).map((p) => p.textContent), ['Start', 'Tests', 'Stock']);
      const current = el.querySelector('[aria-current="page"]');
      assertEqual(current.textContent, 'Tests');
      assertEqual(current.tagName, 'SPAN');
      assertEqual(el.querySelector('a.sb-shell__page').getAttribute('href'), 'index.html');
    });

    test('the page attribute names the current page', () => {
      const el = shell('', 'page="stock.html"');
      el.pages = PAGES;
      assertEqual(el.querySelector('[aria-current="page"]').textContent, 'Stock');
    });

    test('goal and pages set before the shell is built are shown once it is', () => {
      const el = document.createElement('sb-shell');
      el.goal = 'Early goal';
      el.pages = PAGES;
      mount(el);
      assertEqual(el.querySelector('.sb-shell__content').textContent, 'Goal: Early goal');
      assertEqual(pageParts(el).length, 3);
    });

    test('a single page shows no navigation', () => {
      const el = shell();
      el.pages = PAGES.slice(0, 1);
      assert(el.querySelector('.sb-shell__pages').hidden, 'hidden');
    });

    test('page titles and the goal are shown as text, never markup', () => {
      const el = shell();
      el.goal = '<b>bold</b>';
      el.pages = [{ href: 'a.html', title: '<i>A</i>' }, { href: 'b.html', title: 'B' }];
      assert(!el.querySelector('.sb-shell__content b, .sb-shell__pages i'), 'no markup');
      assertEqual(pageParts(el)[0].textContent, '<i>A</i>');
    });

    // ---- Exported pages ----

    test('an exported page says when, and which versions of the sandbox and Sandkit', () => {
      const el = shell('', 'exported="2026-10-18" version="0.4.0" sandkit="0.2.27"');
      const note = el.querySelector('.sb-shell__exported');
      assert(!note.hidden, 'shown');
      assertEqual(note.textContent, 'Exported 18 Oct 2026 · version 0.4.0 · Sandkit 0.2.27');
    });

    test('the export note leaves out versions it wasn\'t given', () => {
      assertEqual(shell('', 'exported="2026-10-18"').querySelector('.sb-shell__exported').textContent, 'Exported 18 Oct 2026');
    });

    test('a page that isn\'t exported has no note', () => {
      assert(shell().querySelector('.sb-shell__exported').hidden, 'hidden');
    });

    test('an exported page shows the other pages as not included, never as links', () => {
      const el = shell('', 'exported="2026-10-18" page="test.html"');
      el.pages = PAGES;
      assertEqual(el.querySelectorAll('a.sb-shell__page').length, 0);
      const excluded = [...el.querySelectorAll('.sb-shell__page--excluded')];
      assertEqual(excluded.map((p) => p.textContent), ['Start', 'Stock']);
      assertEqual(excluded[0].title, 'Not included in this export');
      assertEqual(el.querySelector('[aria-current="page"]').textContent, 'Tests');
    });

    // ---- Export ----

    const exporter = (attrs = '') => shell('<sb-export slot="actions"></sb-export>', attrs).querySelector('sb-export');
    const promptShown = (ex) => ex.querySelector('.sb-export__prompt').value;

    test('sits beside the header controls, and opens its dialog', () => {
      const ex = exporter();
      assert(ex.closest('.sb-shell__actions'), 'in the actions');
      ex.querySelector('.sb-export__button').click();
      assert(ex.querySelector('dialog').open, 'open');
      ex.querySelector('.sb-export__close').click();
      assert(!ex.querySelector('dialog').open, 'closed');
    });

    test('the prompt asks the agent to export this page with the export tool', () => {
      const ex = exporter();
      assert(ex.prompt.startsWith('Export test.html from this sandbox as one standalone HTML file.'), ex.prompt);
      assert(ex.prompt.includes('node lib/sandkit/tools/export.mjs test.html\n'), 'the command');
      assertEqual(promptShown(ex), ex.prompt);
      assert(ex.textContent.includes('export/test.html'), 'says where it saves');
    });

    test('leaving out images changes the prompt', () => {
      const ex = exporter();
      ex.querySelector('input[name="images"]').click();
      assert(ex.prompt.includes('leaving out its images'), 'says so');
      assert(ex.prompt.includes('export.mjs test.html --no-images'), 'passes the flag');
      assertEqual(promptShown(ex), ex.prompt);
    });

    test('copies the prompt, or selects it to copy by hand when the clipboard is refused', async () => {
      const original = Object.getOwnPropertyDescriptor(Navigator.prototype, 'clipboard');
      let copied = null;
      const useClipboard = (writeText) => Object.defineProperty(navigator, 'clipboard', { value: { writeText }, configurable: true });
      try {
        const ex = exporter();
        useClipboard(async (text) => { copied = text; });
        await ex._copy();
        assertEqual(copied, ex.prompt);
        assert(ex.querySelector('.sb-export__status').textContent.startsWith('Copied'), 'says copied');

        useClipboard(() => Promise.reject(new Error('refused')));
        await ex._copy();
        assert(ex.querySelector('.sb-export__status').textContent.includes('Ctrl+C'), 'says how to copy');
      } finally {
        delete navigator.clipboard;
        if (original) Object.defineProperty(Navigator.prototype, 'clipboard', original);
      }
    });

    test('hides in an exported page, which has nothing left to export from', () => {
      assert(exporter('exported="2026-10-18"').hidden, 'hidden');
    });

    test('two export buttons on one page keep their own options', () => {
      mount('<div><sb-export></sb-export><sb-export></sb-export></div>');
      const [a, b] = document.querySelectorAll('#test-fixture sb-export');
      a.querySelector('input[name="images"]').click();
      assert(a.prompt.includes('--no-images') && !b.prompt.includes('--no-images'), 'separate');
    });

    // ---- Settings sections ----

    test('shows the settings sections the sandbox declares, in order', () => {
      const el = shell('<div slot="settings" heading="Simulation">Speed options</div>');
      const titles = [...el.querySelectorAll('.sb-shell__section-title')].map((h) => h.textContent);
      assertEqual(titles, ['Theme', 'Simulation', 'Your settings']);
    });

    test('exports settings from every saveable section', () => {
      const settings = shell().settings;
      assertEqual(settings.format, 'sandkit-settings');
      assertEqual(Object.keys(settings.sections), ['theme']);
    });

    test('rejects a file that is not a settings file', () => {
      assertThrows(() => shell().importSettings({ some: 'thing' }));
    });

    test('passes imported data to the matching section', () => {
      const el = shell();
      el.importSettings({ format: 'sandkit-settings', version: 1, sections: { theme: { choice: 'dark', presets: [] } } });
      assertEqual(root.dataset.theme, 'dark');
    });

    // ---- Theming ----

    test('choosing a theme applies it to the page and fires sb-theme', () => {
      const themes = shell().querySelector('sb-theme-settings');
      themes.querySelector('[value="light"]').click();
      const events = recordEvents(document, 'sb-theme');
      themes.querySelector('[value="dark"]').click();
      assertEqual(root.dataset.theme, 'dark');
      assertEqual(events.at(-1).detail.theme, 'dark');
    });

    test('both built-in themes define a lift: a see-through tint and a shadow', () => {
      const themes = shell().querySelector('sb-theme-settings');
      const lift = {};
      for (const theme of ['light', 'dark']) {
        themes.querySelector(`[value="${theme}"]`).click();
        lift[theme] = [token('lift'), token('lift-shadow')];
      }
      themes.querySelector('[value="auto"]').click();
      assert(lift.light.every(Boolean) && lift.dark.every(Boolean), JSON.stringify(lift));
      assert(lift.light[0] !== lift.dark[0], 'each theme lifts its own way');
      assert(lift.dark[0].startsWith('rgba('), 'see-through, so it works on any layer');
    });

    test('both built-in themes define a drop: a see-through tint of their own', () => {
      const themes = shell().querySelector('sb-theme-settings');
      const drop = {};
      for (const theme of ['light', 'dark']) {
        themes.querySelector(`[value="${theme}"]`).click();
        drop[theme] = token('drop');
      }
      themes.querySelector('[value="auto"]').click();
      assert(drop.light && drop.dark, JSON.stringify(drop));
      assert(drop.light !== drop.dark, 'each theme drops its own way');
      assert(drop.dark.startsWith('rgba('), 'see-through, so it works on any layer');
    });

    test('editing a token previews it live, and Discard reverts it', () => {
      const themes = openThemeEditor();
      const original = token('accent');
      editToken(themes, 'accent', '#e11d48');
      assertEqual(token('accent'), '#e11d48');
      assert(!themes.querySelector('[data-action="discard"]').hidden, 'Discard offered');
      themes.querySelector('[data-action="discard"]').click();
      assertEqual(token('accent'), original);
      assert(themes.querySelector('[data-action="discard"]').hidden, 'Discard hidden again');
    });

    test('the editor is not rebuilt while previewing', () => {
      const themes = openThemeEditor();
      const input = themes.querySelector('[data-token="accent"]');
      editToken(themes, 'accent', '#123456');
      assertEqual(themes.querySelector('[data-token="accent"]'), input);
      themes.querySelector('[data-action="discard"]').click();
    });

    test('saving a preset stores only the changed tokens on top of its base theme', () => {
      const el = shell();
      const themes = openThemeEditor(el);
      themes.querySelector('[value="dark"]').click();
      editToken(themes, 'accent', '#16a34a');
      themes.querySelector('.sb-theme-settings__name').value = 'Forest';
      themes.querySelector('[data-action="save"]').click();

      const { presets, choice } = el.settings.sections.theme;
      const forest = presets.find((p) => p.label === 'Forest');
      assertEqual([forest.base, forest.tokens], ['dark', { accent: '#16a34a' }]);
      assertEqual(choice, forest.id);
      assertEqual(token('accent'), '#16a34a');
    });

    test('deleting the current preset returns to the default theme', () => {
      const el = shell();
      const themes = el.querySelector('sb-theme-settings');
      themes.querySelectorAll('.sb-theme-settings__delete').forEach((button) => button.click());
      const { choice, presets } = el.settings.sections.theme;
      assertEqual({ choice, presets }, { choice: 'auto', presets: [] });
    });

    test('importing presets replaces any with the same id', () => {
      const el = shell();
      const preset = (label) => ({ id: 'preset-x', label, base: 'light', tokens: {} });
      el.importSettings({ format: 'sandkit-settings', sections: { theme: { presets: [preset('One')] } } });
      el.importSettings({ format: 'sandkit-settings', sections: { theme: { presets: [preset('Two')] } } });
      assertEqual(el.settings.sections.theme.presets.map((p) => p.label), ['Two']);
    });

    test('choosing a page width sets --sb-page-width, with Full as none', () => {
      const themes = shell().querySelector('sb-theme-settings');
      themes.querySelector('[value="narrow"]').click();
      assertEqual(root.style.getPropertyValue('--sb-page-width'), '900px');
      assertEqual(localStorage.getItem('sb-page-width'), '"narrow"');
      themes.querySelector('[value="full"]').click();
      assertEqual(root.style.getPropertyValue('--sb-page-width'), 'none');
    });

    test('the page width is exported and imported, and kept when the theme changes', () => {
      const el = shell();
      const themes = el.querySelector('sb-theme-settings');
      themes.querySelector('[value="wide"]').click();
      themes.querySelector('[value="dark"]').click();
      assertEqual(root.style.getPropertyValue('--sb-page-width'), '1400px');
      assertEqual(el.settings.sections.theme.width, 'wide');
      el.importSettings({ format: 'sandkit-settings', sections: { theme: { width: 'narrow' } } });
      assert(themes.querySelector('[value="narrow"]').checked, 'Narrow shown as chosen');
      themes.querySelector('[value="full"]').click();
    });

    test('sandboxes can add their own themes', () => {
      const themes = shell().querySelector('sb-theme-settings');
      themes.themes = themes.themes.concat([{ id: 'sepia', label: 'Sepia' }]);
      assert(themes.querySelector('[value="sepia"]'), 'Sepia offered');
    });

    // ---- Several on one page ----

    test('includes no settings sections the sandbox did not declare', () => {
      const el = mount('<sb-shell heading="Bare"></sb-shell>');
      const titles = [...el.querySelectorAll('.sb-shell__section-title')].map((h) => h.textContent);
      assertEqual(titles, ['Your settings']);
    });

    test('two shells on one page have their own settings dialogs', () => {
      mount('<div><sb-shell heading="One"></sb-shell><sb-shell heading="Two"></sb-shell></div>');
      const titles = [...document.querySelectorAll('#test-fixture .sb-shell__dialog-title')].map((t) => t.id);
      assertEqual(new Set(titles).size, 2, 'unique dialog title ids');
      document.querySelectorAll('#test-fixture dialog').forEach((dialog, i) => {
        assertEqual(dialog.getAttribute('aria-labelledby'), titles[i]);
      });
    });

    test('two theme sections each show the current theme', () => {
      mount('<div><sb-theme-settings></sb-theme-settings><sb-theme-settings></sb-theme-settings></div>');
      const [a, b] = document.querySelectorAll('#test-fixture sb-theme-settings');
      a.querySelector('[value="light"]').click();
      a.querySelector('[value="dark"]').click();
      assert(a.querySelector('[value="dark"]').checked && b.querySelector('[value="dark"]').checked, 'both show dark');
    });
  </script>
</body>
</html>
