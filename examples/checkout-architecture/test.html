<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout architecture sandbox tests</title>
  <script src="../../test/harness.js"></script>
  <script src="model.js"></script>
</head>
<body>
  <script>
    test('knows each part by its code, and what it sits inside', () => {
      assertEqual(checkout.element('CMP-3').name, 'Payments');
      assertEqual(checkout.path('CMP-3'), ['SYS-1', 'CON-2']);
      assertEqual(checkout.path('PER-1'), []);
      assertEqual(checkout.element('XYZ-1'), null);
    });

    test('every relationship joins two parts that exist', () => {
      for (const r of CHECKOUT.relationships) assert(checkout.element(r.from) && checkout.element(r.to), r.id);
    });

    test('a part\'s connections are what cross its edge, made by it or by anything inside it', () => {
      const shop = checkout.connections('SYS-1');
      assertEqual(shop.outgoing.map((c) => [c.relationship.id, c.via]), [['REL-5', 'CMP-3']], 'Payments charges the card, from inside');
      assertEqual(shop.incoming.map((c) => [c.relationship.id, c.via]), [['REL-1', 'CON-1']]);
    });

    test('calls between parts inside a box don\'t cross its edge', () => {
      const api = checkout.connections('CON-2');
      assertEqual(api.outgoing.map((c) => c.relationship.id), ['REL-5', 'REL-6', 'REL-7']);
      assertEqual(api.incoming.map((c) => c.relationship.id), ['REL-2']);
    });

    test('defines codes for pills: parts and relationships', () => {
      assertEqual(checkout.define('CON-3').kind, 'Database');
      assertEqual(checkout.define('REL-5').title, 'Payments → Payment provider');
      assertEqual(checkout.define('XYZ-1'), null);
    });

    test('every message travels along a relationship joining its two ends, replies the other way', () => {
      for (const m of [...PLACE_ORDER, ...PAYMENT_DECLINED]) {
        const r = checkout.relationship(m.along);
        const ends = m.kind === 'reply' ? [m.to, m.from] : [m.from, m.to];
        assertEqual([r.from, r.to], ends, m.id);
      }
    });

    test('the conversation\'s participants are listed in the order they first take part', () => {
      assertEqual(checkout.participants(PLACE_ORDER), ['PER-1', 'CON-1', 'CMP-1', 'CMP-2', 'CON-3', 'CMP-3', 'SYS-2']);
    });

    test('a message is seen inside whatever holds the deeper of its two ends', () => {
      const byId = (id) => PLACE_ORDER.find((m) => m.id === id);
      assertEqual(checkout.viewOf(byId('MSG-1')), ['SYS-1'], 'shopper to Storefront: inside the shop');
      assertEqual(checkout.viewOf(byId('MSG-8')), ['SYS-1', 'CON-2'], 'Payments to the provider: inside the API');
    });

    // Follows a path such as basket.items[0].unit_price into a value; undefined if it leads nowhere.
    const at = (value, path) => path.split(/\.|(?=\[)/).reduce((v, key) => v?.[key.replace(/^\[(\d+)\]$/, '$1')], value);

    test('every field a payload spotlights or notes is in its body', () => {
      for (const [id, p] of Object.entries(PAYLOADS)) {
        for (const path of [...p.spotlight, ...Object.keys(p.notes)]) assert(at(p.body, path) !== undefined, `${id}: ${path}`);
      }
    });

    test('the amounts agree: the basket, the charge, the provider and the order', () => {
      const item = PAYLOADS['MSG-2'].body.basket.items[0];
      const total = item.quantity * item.unit_price;
      assertEqual([PAYLOADS['MSG-8'].body.amount, PAYLOADS['MSG-9'].body.amount, PAYLOADS['MSG-12'].body.order.total], [total, total, total]);
    });

    test('payloads belong to messages in the conversation', () => {
      for (const id of Object.keys(PAYLOADS)) assert(PLACE_ORDER.some((m) => m.id === id), id);
    });

    test('every write goes to a table and fields the database has', () => {
      const tables = Object.fromEntries(SHOP_DATABASE.tables.map((t) => [t.id, t.fields.map((f) => f.name)]));
      for (const w of DATABASE_WRITES) {
        assert(tables[w.table], `${w.message}: ${w.table}`);
        for (const f of Object.keys(w.insert ?? w.set)) assert(tables[w.table].includes(f), `${w.message}: ${w.table}.${f}`);
      }
    });

    test('only messages sent to the database write to it', () => {
      const messages = [...PLACE_ORDER, ...PAYMENT_DECLINED];
      for (const w of DATABASE_WRITES) assertEqual(messages.find((m) => m.id === w.message).to, 'CON-3', w.message);
    });

    test('replaying the writes leaves the order paid, and two mugs fewer in stock', () => {
      const all = replayWrites(SHOP_DATABASE.rows, DATABASE_WRITES, ['MSG-4', 'MSG-6', 'MSG-11']);
      assertEqual(all.stock[0].in_stock, 12);
      assertEqual(all.orders, [{ number: 1042, status: 'paid', total: 2450, charge_id: PAYLOADS['MSG-9'].body.id }]);
      assertEqual(replayWrites(SHOP_DATABASE.rows, DATABASE_WRITES, ['MSG-4', 'MSG-6']).orders[0].status, 'pending', 'before payment');
      assertEqual(SHOP_DATABASE.rows.stock[0].in_stock, 14, 'the starting rows are left as they were');
    });

    test('a declined payment is the same conversation up to the charge, then goes another way', () => {
      assertEqual(PAYMENT_DECLINED.slice(0, 8), PLACE_ORDER.slice(0, 8));
      assertEqual(PAYMENT_DECLINED[8].from, 'SYS-2', 'the provider answers');
      const ids = [...PLACE_ORDER, ...PAYMENT_DECLINED].map((m) => m.id);
      assertEqual(new Set(ids).size, new Set([...PLACE_ORDER, ...PAYMENT_DECLINED]).size, 'each code names one message');
    });

    test('when payment fails, the mugs go back and the order is kept, marked failed', () => {
      const after = replayWrites(SHOP_DATABASE.rows, DATABASE_WRITES, PAYMENT_DECLINED.map((m) => m.id));
      assertEqual(after.stock[0].in_stock, SHOP_DATABASE.rows.stock[0].in_stock, 'stock as it was');
      assertEqual(after.orders, [{ number: 1042, status: 'failed', total: 2450, charge_id: null }], 'no charge to record');
    });

    test('says what a code is linked to: a part\'s place and lines, a line\'s ends and messages', () => {
      const pairs = (code) => checkout.linksOf(code).map((l) => `${l.relation} ${l.ref}`);
      assertEqual(pairs('CMP-3'), ['inside CON-2', 'calls out along REL-5', 'called along REL-4']);
      assertEqual(pairs('REL-5'), ['from CMP-3', 'to SYS-2', 'carries MSG-8', 'carries MSG-9', 'carries MSG-14']);
      assertEqual(pairs('MSG-8'), ['along REL-5', 'from CMP-3', 'to SYS-2']);
      assertEqual(checkout.linksOf('CMP-3')[0].title, 'Shop API', 'each with its title');
      assertEqual(checkout.linksOf('orders'), [], 'nothing for what the model doesn\'t know');
    });

    test('the sandbox page starts, and a name in the prose goes to its part in the diagram', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const outline = page.getElementById('outline');
      assertEqual(page.querySelectorAll('#diagram .sb-c4__element').length, 3, 'the overview: shopper, shop, provider');
      assertEqual(outline.querySelectorAll('.sb-tree__item').length, 9, 'every part in the outline');
      assert(page.getElementById('details').textContent.includes('Payments charges the card through Payment provider'), 'the shop\'s details');

      const diagram = page.getElementById('diagram');
      assertEqual(diagram.querySelector('[data-ref="CMP-3"]'), null, 'inside the API, not drawn to begin with');
      page.querySelector('.go[data-go="CMP-3"]').click();
      assertEqual(diagram.path, ['SYS-1', 'CON-2'], 'walked into the API');
      assert(diagram.querySelector('[data-ref="CMP-3"]').classList.contains('sb-c4__element--highlighted'), 'and lit up');
    });

    test('chapter 2 steps through the order, the diagram following each message', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const conversation = page.getElementById('conversation'), flow = page.getElementById('flow-diagram');
      assertEqual(conversation.querySelectorAll('.sb-sequence__message').length, 13, 'every message');
      assertEqual(flow.path, ['SYS-1'], 'the first message, inside the shop');

      conversation.querySelector('[data-ref="MSG-8"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      assertEqual(conversation.current, 'MSG-8');
      assertEqual(flow.path, ['SYS-1', 'CON-2'], 'walked into the API');
      assert(flow.querySelector('[data-ref="CMP-3"]').classList.contains('sb-c4__element--highlighted'), 'Payments lit');
      const walk = page.getElementById('order-walk');
      assertEqual(walk.step, 7, 'the walkthrough at its step');
      assert(walk.current.element.textContent.includes('only call that leaves the shop'), 'said in words');

      walk.next();
      assertEqual([conversation.current, flow.path], ['MSG-9', ['SYS-1', 'CON-2']], 'Next moves the story on');
    });

    test('chapter 3 shows what each message carries, its fields spotlit', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const walk = page.getElementById('payload-walk'), json = page.getElementById('payload');
      assertEqual(walk.steps.length, 4, 'one step per message that carries data');
      assertEqual([page.getElementById('payload-conversation').current, json.spotlight], ['MSG-2', ['basket.items[0].unit_price', 'payment_method']]);
      walk.next();
      assertEqual(page.getElementById('payload-conversation').current, 'MSG-8');
      assertEqual(json.value.amount, 2450);
      assert(json.querySelector('.sb-json__line--spotlit'), 'the fields that matter are marked');
    });

    test('chapter 4 replays the writes, marking what each one changed', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const walk = page.getElementById('store-walk'), orders = page.getElementById('rows-orders');
      assertEqual(walk.steps.length, 4, 'before the order, then three writes');
      assertEqual(orders.rows.length, 0, 'no orders to begin with');
      walk.next(); walk.next(); walk.next();
      assertEqual(orders.rows[0].status, 'paid');
      assertEqual(orders.querySelectorAll('.sb-table__cell--changed').length, 2, 'status and charge_id changed');
      assert(page.querySelector('#schema [data-ref="orders.status"]').classList.contains('sb-erd__field--highlighted'), 'the field lit in the diagram');

      walk.current.element.querySelector('[data-ref="orders.status"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
      assertEqual(JSON.stringify(orders.highlight), '{"columns":["status"]}', 'pointing at a field lights its column');
      walk.current.element.querySelector('[data-ref="orders"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
      assertEqual(JSON.stringify(orders.highlight), '{"rows":["1042"]}', 'pointing at a table lights its rows');
    });

    test('chapter 5 follows the declined payment from the charge, undoing what was done', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const walk = page.getElementById('fail-walk'), sequence = page.getElementById('fail-conversation');
      const stock = page.getElementById('fail-stock'), orders = page.getElementById('fail-orders');
      assertEqual(walk.steps.length, 11, 'so far, the charge and eight messages after it, then a lost reply');
      assertEqual([sequence.current, stock.rows[0].in_stock, orders.rows[0].status], ['MSG-7', 12, 'pending'], 'so far');

      sequence.querySelector('[data-ref="MSG-19"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      assertEqual(walk.current.element.dataset.message, 'MSG-19', 'clicking a message goes to its step');
      assertEqual([stock.rows[0].in_stock, orders.rows[0].status], [14, 'failed'], 'the mugs back, the order kept as failed');
      assertEqual(page.getElementById('store-walk').steps.length, 4, 'chapter 4 keeps to the order that went through');
    });

    test('clicking a code lists where it appears; clicking a hidden place opens its chapter', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1300px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const xref = page.getElementById('xref'), chapters = page.getElementById('chapters');
      page.querySelector('#details sb-id[code="REL-5"] button').click();
      assertEqual(xref.subject.ref, 'REL-5');
      assert(!page.getElementById('xref-panel').hidden, 'the panel opens');
      assertEqual(new Set(xref.places.map((p) => p.view.split(' ›')[0])).size, 3, 'in chapters 1, 2 and 5');
      assert(xref.places.some((p) => p.unavailable), 'steps not showing are listed, but can\'t be gone to');

      const placesOfRel5 = xref.places.length;
      const hidden = xref.places.findIndex((p) => p.hidden && !p.unavailable);
      xref.querySelector(`.sb-xref__place[data-index="${hidden}"]`).click();
      assertEqual(chapters.selected, 1, 'going there opened chapter 2');
      assert(page.querySelectorAll('[data-ref="REL-5"]')[hidden].checkVisibility(), 'and the place can be seen');

      xref.querySelector('.sb-xref__link').click();
      assertEqual(xref.subject.ref, 'CMP-3', 'following a link moves on');
      xref.querySelector('.sb-xref__back').click();
      assertEqual([xref.subject.ref, xref.places.length], ['REL-5', placesOfRel5], 'and Back returns, with its places');
    });

    test('the tour opens what hides each part, waits for a code to be clicked, and finishes', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1300px; height: 900px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const tour = page.getElementById('checkout-tour'), chapters = page.getElementById('chapters');
      assert(page.getElementById('xref-panel').checkVisibility() === false, 'the cross-reference waits to be opened');

      page.getElementById('tour-start').click();
      assertEqual([tour.current.index, tour.anchor], [0, null], 'an opening, in the middle');
      tour.next();
      assert(tour.anchor.matches('#diagram .sb-c4__element'), 'the shop, in the diagram');
      tour.next();
      assert(tour.anchor.matches('#outline .sb-tree__item') && tour.anchor.checkVisibility(), 'Payments, its branch opened');

      tour.next();
      assertEqual(tour.anchor, page.getElementById('details'));
      tour.next();
      assertEqual(tour.current.index, 3, 'waits for a code to be clicked');
      page.querySelector('#details sb-id button').click();
      tour.next();
      assertEqual(chapters.selected, 1, 'chapter 2 opened');
      assert(tour.anchor.closest('#conversation') && tour.anchor.checkVisibility(), 'the charge, in the sequence');

      tour.next();
      tour.next();
      assertEqual(tour.open, false, 'done');
    });

    test('comments cite what was clicked, the view, the version and where the viewer was', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1300px; height: 900px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const comments = page.getElementById('comments');
      const clickOn = (node, init = {}) => {
        const r = node.getBoundingClientRect();
        node.dispatchEvent(new frame.contentWindow.MouseEvent('click', { bubbles: true, cancelable: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, ...init }));
      };
      const write = (text) => {
        const area = comments.querySelector('.sb-comments__box textarea');
        area.value = text;
        area.dispatchEvent(new Event('input', { bubbles: true }));
        comments.querySelector('[data-action="save"]').click();
      };

      page.getElementById('outline').expanded = ['SYS-1'];
      const picker = page.querySelector('.sb-shell__mode');
      picker.value = [...picker.options].find((o) => o.text.startsWith('Comment')).value;
      picker.dispatchEvent(new Event('change'));
      clickOn(page.querySelector('#diagram [data-ref="SYS-2"]'));
      write('Is the provider really outside the shop?');
      clickOn(page.querySelector('#outline [data-ref="CON-1"] .sb-tree__row'));
      write('Is the Storefront one app, or several?');
      assertEqual(page.getElementById('chapters').selected, 0, 'picking never acted on the page');

      comments.querySelector('[data-action="done"]').click();
      const prompt = comments.toMarkdown();
      assert(prompt.startsWith('# Feedback on Checkout architecture (version 0.8.0)'), prompt.split('\n')[0]);
      assert(prompt.includes('## #1 · Question · SYS-2 · 1 · The parts'), 'the part and its chapter');
      assert(prompt.includes('## #2 · Question · CON-1, SYS-1 · 1 · The parts'), 'a part in the outline, and what holds it');
      assert(prompt.includes('State: chapter 1 · The parts.'), 'where the viewer was');
      comments.querySelector('[data-action="close"]').click();
      assertEqual(comments.comments, [], 'Done leaves a clean page');
    });
  </script>
</body>
</html>
