<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Linear algebra sandbox tests</title>
  <script src="../../test/harness.js"></script>
  <script src="model.js"></script>
</head>
<body>
  <script>
    test('describes a vector as steps from the origin', () => {
      assertEqual(vectors.describe([2, 1]), '2 right, 1 up');
      assertEqual(vectors.describe([-3, 0]), '3 left');
      assertEqual(vectors.describe([0, 0]), 'stay at the origin');
    });

    test('a linear combination scales each vector, then adds them', () => {
      assertEqual(vectors.combine(1, [2, 1], -1, [-1, 2]), [3, -1]);
      assertEqual(vectors.scale(-0.5, [2, 4]), [-1, -2]);
    });

    test('knows when two vectors line up, so their span is only a line', () => {
      assert(vectors.lineUp([2, 1], [-4, -2]), 'opposite directions still line up');
      assert(vectors.lineUp([2, 1], [0, 0]), 'the zero vector lines up with anything');
      assert(!vectors.lineUp([2, 1], [-1, 2]), 'different directions');
    });

    test('writes numbers as people do: a true minus sign, bracketed inside sums', () => {
      assertEqual(number(-1.5), '−1.5');
      assertEqual(term(-1), '(−1)');
      assertEqual(pair([2, -0.333]), '(2, −0.33)');
    });

    test('the sandbox page starts and draws chapter 1', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const adding = page.getElementById('adding');
      assertEqual(adding.querySelectorAll('.sb-plane__shaft').length, 4, 'v, w, w after v, and the sum');
      assert(page.getElementById('adding-explain').textContent.includes('v + w = (2 + (−1), 1 + 2) = (1, 3)'), 'the sum, worked through');
    });

    test('chapters are tabs, and the button at the end of chapter 1 moves on', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const chapters = frame.contentDocument.getElementById('chapters');
      assertEqual(chapters.panels.map((p) => p.getAttribute('heading')), ['1 · Vectors', '2 · Combinations and span', '3 · Matrices']);
      frame.contentWindow.localStorage.removeItem('sb-tabs:chapters');
      chapters.selected = 0;
      frame.contentDocument.querySelector('.next').click();
      assertEqual(chapters.selected, 1);
      frame.contentWindow.localStorage.removeItem('sb-tabs:chapters');
    });

    test('chapter 2 shows the combination, and the span on request', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      assertEqual(page.querySelectorAll('#scalars .sb-parameters__parameter').length, 2, 'sliders for a and b');
      const combining = page.getElementById('combining');
      assertEqual(combining.querySelectorAll('.sb-plane__dot').length, 1, 'only P before the span is shown');
      page.getElementById('show-span').click();
      assert(combining.querySelectorAll('.sb-plane__dot').length > 100, 'the span fills in');
      assert(page.getElementById('combining-explain').textContent.includes('the whole plane'), 'explains the span');
    });

    test('chapter 3: editing the matrix moves space, and its columns are where î and ĵ land', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      const field = page.querySelector('#matrix-a input[data-row="0"][data-column="0"]');
      field.value = '2';
      field.dispatchEvent(new Event('input', { bubbles: true }));
      assertEqual(page.getElementById('moving').matrix, [[2, 1], [0, 1]]);
      const iColumn = [...page.querySelectorAll('#product [data-ref="î"] mn')].map((n) => n.textContent);
      assertEqual(iColumn, ['2', '0'], 'the equation shows where î lands');
    });

    test('chapter 3: pointing at î lights its column, its term and its arrows everywhere', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      page.querySelector('#product [data-ref="î"]').dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
      const litColumn = [...page.querySelectorAll('#matrix-a .sb-matrix__cell--highlighted input')].map((i) => i.dataset.column);
      assertEqual(litColumn, ['0', '0'], 'the first column of A');
      assertEqual(page.getElementById('moving').highlight, ['i-hat', 'i-lands'], 'î and where it lands');
      assert([...page.querySelectorAll('sb-id')].some((pill) => pill.code === 'î' && pill.classList.contains('sb-id--lit')), 'the î pill');
    });
  </script>
</body>
</html>
