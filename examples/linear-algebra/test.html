<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Linear algebra sandbox tests</title>
  <script src="../../test/harness.js"></script>
  <script src="model.js"></script>
</head>
<body>
  <script>
    test('describes a vector as steps from the origin', () => {
      assertEqual(vectors.describe([2, 1]), '2 right, 1 up');
      assertEqual(vectors.describe([-3, 0]), '3 left');
      assertEqual(vectors.describe([0, 0]), 'stay at the origin');
    });

    test('the sandbox page starts and draws chapter 1', async () => {
      const frame = mount('<iframe src="index.html" style="width: 1100px; height: 800px"></iframe>');
      await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      const page = frame.contentDocument;
      assertEqual(page.querySelectorAll('.sb-plane__shaft').length, 4, 'v, w, w after v, and the sum');
      assert(page.getElementById('explain').textContent.includes('v + w = (2 + -1, 1 + 2) = (1, 3)'), 'the sum, worked through');
    });
  </script>
</body>
</html>
